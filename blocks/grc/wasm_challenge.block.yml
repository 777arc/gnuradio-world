id: wasm_challenge
label: Challenge
category: '[GNU Radio World]'

documentation: |-
    Turns a flowgraph into a challenge: what the reader has to achieve, and how
    the editor decides they achieved it.

    This block carries metadata only. It has no GNU Radio block behind it -- the
    runner drops it while lowering the flowgraph, exactly as it drops Note --
    so it never reaches the block registry and costs a running flowgraph
    nothing. It is also hidden from the block palette: authoring a challenge is
    a repository activity, and nobody should drop one onto a flowgraph by
    accident.

    Challenge ID is the progress key. It is deliberately not derived from the
    file name, so a challenge can be renamed or reordered without resetting
    anyone's progress. Requires names the Challenge ID of the challenge that has
    to be passed first, and is empty for the first one in a series; the
    Example Flowgraphs list shows a locked challenge dimmed, with a lock, and
    refuses to load it from the list until its prerequisite is passed.

    Success Criteria is a JSON array. Every entry has a "goal" -- the sentence
    the reader sees in the checklist on this block's face -- plus a "kind" and
    the fields that kind needs:

      param            block, param, and one of: equals; equals + tolerance;
                       min and/or max; matches (a regular expression)
      block_present    id, optional count (default 1)
      connected        from, to, optional from_port / to_port
      detected_signal  center_freq + center_tol, optional bandwidth +
                       bandwidth_tol, min_peak_level, min_total_power, sink
      ran              optional seconds (default 2)

    The first three are checked against the flowgraph as it is edited. The last
    two need the flowgraph to be running, and are checked against what the
    Spectrum Analyzer reports while it runs.

    Parameter values are compared after evaluation, so 200, 2*100 and a variable
    holding 200 all satisfy {"equals": 200}. Blocks are addressed by their block
    ID, so renaming one in a challenge flowgraph breaks its criteria -- which is
    why an unresolvable name, an unknown kind and malformed JSON are all
    reported as errors on this block rather than as a goal that can never pass.

    This block exists only in the WebAssembly runner -- it has no Python
    implementation, so desktop GNU Radio would drop it on a re-save.

parameters:
-   id: challenge_id
    label: Challenge ID
    dtype: string
    default: ''
-   id: title
    label: Title
    dtype: string
    default: ''
-   id: requires
    label: Requires
    dtype: string
    default: ''
-   id: criteria
    label: Success Criteria
    dtype: string
    default: '[]'
    # The block face draws the checklist itself, so the raw JSON never appears
    # on it -- the same reason GUI Layout hides its own `layout` parameter.
    hide: part

file_format: 1
