id: wasm_spectrum_analyzer_sink
label: Spectrum Analyzer
category: '[GNU Radio World]'
flags: [cpp]

# The factory in registry.cpp builds a QWidget placeholder used by GUI Layout;
# the visible instrument is a browser-native DOM/canvas overlay aligned to it.
gui: true

documentation: |-
    A browser-native spectrum analyzer with a single frequency-domain display.
    It accepts either complex or float streams. Complex input is shown from
    Center Frequency - Sample Rate/2 through Center Frequency + Sample Rate/2;
    float input shows only its non-negative frequencies, from Center Frequency
    through Center Frequency + Sample Rate/2.

    The running instrument provides clear/write, averaging, and max-hold traces;
    run/hold and autoscale controls; and always-on automatic signal detection and
    occupied-bandwidth measurement. Drag a rectangle on the plot to zoom its
    frequency and level axes; right-click to return one level through the zoom
    history. Its automatic detector learns a default noise floor from the lower
    tail of the first 10,000 spectrum bins.
    It uses the 20th percentile with the statistical correction appropriate for
    exponential FFT-bin noise power, avoiding both occupied bins and anomalously
    low FFT nulls, then places the threshold 6 dB above that estimate. Automatic
    mode adapts the estimate slowly in subsequent 10,000-bin batches. The
    threshold remains editable with a slider in the running GUI and can be
    re-learned at any time. Every above-threshold signal receives a stable color, a solid
    center-frequency line, shaded 99% occupied bandwidth with dashed edges, and
    one live annotation above its center containing center frequency, bandwidth,
    and the maximum-bin level. The peak frequency remains available in numeric
    plot data.
    Detection uses a two-pass linear-power moving average (a triangular
    frequency-domain envelope) to suppress isolated noise crossings, consolidate
    threshold-edge fragments, and join natural periodogram notches inside
    modulated signals. Peak and bandwidth measurements retain the unsmoothed FFT
    bins.

    Levels are dBFS by default. A complex carrier of magnitude 1, or a full-scale
    real sinusoid, reads 0 dBFS when it falls exactly on an FFT bin. Calibration
    Offset is added to every displayed level; changing Level Unit to dBm or dBuV
    is meaningful only when that offset accounts for the complete input chain.

    FFT analysis is rate-limited by Update Period and always uses the newest
    complete FFT frame, so a high-rate stream does not make the GUI consume every
    possible overlapping transform. Resolution bandwidth is reported using the
    selected window's equivalent noise bandwidth.

    This block exists only in the WebAssembly runner and does not run in desktop
    GNU Radio.

parameters:
-   id: name
    label: Title
    dtype: string
    default: '"Spectrum Analyzer"'
-   id: type
    label: Input Type
    dtype: enum
    default: complex
    options: [complex, float]
    option_labels: [Complex, Float32]
    hide: part
-   id: samp_rate
    label: Sample Rate (Hz)
    dtype: real
    default: samp_rate
-   id: center_freq
    label: Center Frequency (Hz)
    dtype: real
    default: '0'
-   id: fftsize
    label: FFT Size
    dtype: int
    default: '4096'
    options: ['256', '512', '1024', '2048', '4096', '8192', '16384', '32768', '65536']
-   id: wintype
    label: Window Type
    dtype: enum
    default: window.WIN_BLACKMAN_hARRIS
    options: [window.WIN_BLACKMAN_hARRIS, window.WIN_HAMMING, window.WIN_HANN,
        window.WIN_BLACKMAN, window.WIN_RECTANGULAR, window.WIN_FLATTOP]
    option_labels: [Blackman-harris, Hamming, Hann, Blackman, Rectangular, Flat-top]
    hide: part
-   id: update_time
    label: Update Period (s)
    dtype: real
    default: '0.10'
-   id: average
    label: Averaging
    dtype: enum
    default: '0.2'
    options: ['1.0', '0.5', '0.2', '0.1', '0.05']
    option_labels: [None, Light, Medium, High, Very High]
-   id: trace_mode
    label: Initial Trace Mode
    dtype: enum
    default: average
    options: [clear_write, average, max_hold]
    option_labels: [Clear / Write, Average, Max Hold]
-   id: reference_level
    label: Reference Level
    dtype: real
    default: '0'
-   id: db_per_div
    label: dB per Division
    dtype: real
    default: '10'
-   id: level_offset_db
    label: Calibration Offset (dB)
    dtype: real
    default: '0'
-   id: level_unit
    label: Level Unit
    dtype: string
    default: '"dBFS"'
-   id: peak_track
    label: Track Peak Initially
    dtype: bool
    default: 'False'
    options: ['True', 'False']
    option_labels: [Yes, No]
-   id: obw_percent
    label: Occupied Bandwidth (%)
    dtype: real
    default: '99'
-   id: obw_span
    label: Measurement Span (Hz, 0 = full)
    dtype: real
    default: '0'

inputs:
-   domain: stream
    dtype: ${ type }

asserts:
- ${ samp_rate > 0 }
- ${ fftsize >= 256 and fftsize <= 65536 }
- ${ update_time >= 0.02 }
- ${ average > 0 and average <= 1 }
- ${ db_per_div > 0 }
- ${ obw_percent > 0 and obw_percent < 100 }
- ${ obw_span >= 0 }

file_format: 1
