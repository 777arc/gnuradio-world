id: wasm_video_sink
label: Video Sink
category: '[GNU Radio World]'
flags: [cpp]

# The factory in registry.cpp builds a QWidget, so this block takes a tile in
# the runner window's GUI Layout grid. See tools/block_overrides.py.
gui: true

documentation: |-
    Displays a stream of grayscale pixels as a live picture, one input item
    per pixel, Width items per row and Height rows per frame, scanned left to
    right and top to bottom -- the browser's stand-in for gr-video-sdl's Video
    SDL Sink in its 1-channel (grayscale) mode, which has no SDL to draw with
    here.

    Pixel values are luma from 0 (black) to 255 (white). A short or float item
    outside that range is clipped rather than wrapped, so a Normalize Flow
    output that overshoots by a little does not flash. The picture is painted
    as it arrives, row by row, and scaled to fit its tile.

    Display Width and Display Height set the shape it is shown at, as Video
    SDL Sink's do: the frame is stretched to that aspect ratio, then scaled
    to fit the tile. Leave both at 0 to show it at the input's own shape. A
    TEMPEST frame needs this -- sampled at 30 MS/s, 620 samples span each
    1344-pixel line, so a 620-wide frame is shown at 1024x768 to look like
    the screen it came from.

    Its first use is displaying the frame gr-tempest recovers from a video
    cable's emissions: Framing emits Htotal x Vtotal floats per frame, and this
    sink with matching Width and Height turns them back into the screen.

    This block exists only in the WebAssembly runner -- a flowgraph using it
    will not run in desktop GNU Radio; there, Video SDL Sink is the equivalent.

parameters:
-   id: name
    label: Name
    dtype: string
    default: '"Video"'
-   id: type
    label: Input Type
    dtype: enum
    default: float
    options: [float, short, byte]
    option_attributes:
        size: [gr.sizeof_float, gr.sizeof_short, gr.sizeof_char]
    hide: part
-   id: width
    label: Width
    dtype: int
    default: '640'
-   id: height
    label: Height
    dtype: int
    default: '480'
-   id: display_width
    label: Display Width
    dtype: int
    default: '0'
    hide: part
-   id: display_height
    label: Display Height
    dtype: int
    default: '0'
    hide: part

inputs:
-   domain: stream
    dtype: ${ type }

asserts:
-   ${ width > 0 }
-   ${ height > 0 }
-   ${ display_width >= 0 }
-   ${ display_height >= 0 }

file_format: 1
