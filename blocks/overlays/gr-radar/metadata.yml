# --- Tools ------------------------------------------------------------------

radar_crop_matrix_vcvc:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <radar/crop_matrix_vcvc.h>']
    declarations: 'radar::crop_matrix_vcvc::sptr ${id};'
    make: 'this->${id} = radar::crop_matrix_vcvc::make(${vlen}, ${crop_x}, ${crop_y}, ${len_key});'
    link: [gnuradio-radar]

radar_transpose_matrix_vcvc:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <radar/transpose_matrix_vcvc.h>']
    declarations: 'radar::transpose_matrix_vcvc::sptr ${id};'
    make: 'this->${id} = radar::transpose_matrix_vcvc::make(${vlen_in}, ${vlen_out}, ${len_key});'
    link: [gnuradio-radar]

radar_find_max_peak_c:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <radar/find_max_peak_c.h>']
    declarations: 'radar::find_max_peak_c::sptr ${id};'
    make: 'this->${id} = radar::find_max_peak_c::make(${samp_rate}, ${threshold}, ${samp_protect}, ${max_freq}, ${cut_max_freq}, ${len_key});'
    link: [gnuradio-radar]

radar_msg_gate:
  flags: [python, cpp]
  # Upstream types the key list `raw` because it holds a Python sequence of
  # symbol names -- `('range','velocity')`. Nothing on the way to the runner
  # evaluates it, so type it as the sequence of strings it is and let
  # wasm_registry::string_vector() parse the Python spelling. Same for
  # msg_manipulator's `symbols` below.
  parameter_dtypes:
    msg_keys: string_vector
  cpp_templates:
    includes: ['#include <radar/msg_gate.h>']
    declarations: 'radar::msg_gate::sptr ${id};'
    make: 'this->${id} = radar::msg_gate::make(${msg_keys}, ${val_min}, ${val_max});'
    link: [gnuradio-radar]

radar_msg_manipulator:
  flags: [python, cpp]
  parameter_dtypes:
    symbols: string_vector
  cpp_templates:
    includes: ['#include <radar/msg_manipulator.h>']
    declarations: 'radar::msg_manipulator::sptr ${id};'
    make: 'this->${id} = radar::msg_manipulator::make(${symbols}, ${const_add}, ${const_mult});'
    link: [gnuradio-radar]

radar_print_results:
  flags: [python, cpp]
  # Leave "Store messages" off: that mode writes the estimates to a file, and
  # Emscripten's filesystem is in-memory, so nothing can read one back. The
  # default mode prints each estimate, which reaches the editor's console pane
  # like any other block's output.
  cpp_templates:
    includes: ['#include <radar/print_results.h>']
    declarations: 'radar::print_results::sptr ${id};'
    make: 'this->${id} = radar::print_results::make(${store_msg}, ${filename});'
    link: [gnuradio-radar]

radar_split_cc:
  flags: [python, cpp]
  # Upstream's yaml says real_vector, but split_cc::make() takes
  # std::vector<int> -- the parts are sample counts. The Python generator never
  # had to agree with the C++ signature; this one does.
  parameter_dtypes:
    packet_parts: int_vector
  cpp_templates:
    includes: ['#include <radar/split_cc.h>']
    declarations: 'radar::split_cc::sptr ${id};'
    make: 'this->${id} = radar::split_cc::make(${packet_num}, ${packet_parts}, ${len_key});'
    link: [gnuradio-radar]

radar_split_fsk_cc:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <radar/split_fsk_cc.h>']
    declarations: 'radar::split_fsk_cc::sptr ${id};'
    make: 'this->${id} = radar::split_fsk_cc::make(${samp_per_freq}, ${samp_discard}, ${len_key});'
    link: [gnuradio-radar]

radar_ts_fft_cc:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <radar/ts_fft_cc.h>']
    declarations: 'radar::ts_fft_cc::sptr ${id};'
    make: 'this->${id} = radar::ts_fft_cc::make(${packet_len}, ${len_key});'
    link: [gnuradio-radar]

