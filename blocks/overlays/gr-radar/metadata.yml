    link: [gnuradio-radar]

radar_tracking_singletarget:
  flags: [python, cpp]
  # Upstream leaves Filter a free-text field with no default, and the impl only
  # recognizes the two spellings below -- anything else (including the empty
  # default) silently tracks nothing at all. Name them, and start on one.
  documentation: |-
    Tracks a single target's range and velocity across measurements, smoothing
    the per-measurement estimates into a track.

    Filter selects the estimator: "kalman" for a two-state Kalman filter over
    range and velocity, or "particle" for a particle filter with Particle
    number samples. No other value does anything.
  parameter_defaults:
    filter: kalman
  cpp_templates:
    includes: ['#include <radar/tracking_singletarget.h>']
    declarations: 'radar::tracking_singletarget::sptr ${id};'
    make: 'this->${id} = radar::tracking_singletarget::make(${num_particle}, ${std_range_meas}, ${std_velocity_meas}, ${std_accel_sys}, ${threshold_track}, ${threshold_lost}, ${filter});'
    link: [gnuradio-radar]

