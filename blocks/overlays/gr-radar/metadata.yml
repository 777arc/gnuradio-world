# Browser-only block metadata for the vendored out-of-tree module gr-radar
# (kit-cel/gr-radar, the Communications Engineering Lab at KIT).
#
# Keeping these overlays here instead of in the submodule's own .block.yml is what
# lets that submodule stay pinned to a pristine upstream commit: nothing in the
# checkout has to be edited, rebased, or pushed to a fork to add a block. See
# tools/block_overrides.py for the supported keys, and docs/adding-modules.md
# for the out-of-tree checklist this file is step 3 of.
#
# Every gr-radar block has a C++ impl, so all but five are ordinary generated
# factories in the deferred `radar` side module. The five that are not:
#
#   radar_qtgui_time_plot / _scatter_plot / _spectrogram_plot
#       Qwt QWidgets declaring Q_OBJECT, and the runner build has no moc pass.
#       They are also the only thing in a gr-radar flowgraph that ever displays
#       an estimate, so they are rebuilt in blocks/overlays/gr-radar/radar_plots.*
#       against the Qwt already linked into the main module, with hand-written
#       factories in runner/src/registry.cpp. All they declare here is that the
#       factory builds a widget, and so takes a tile in the GUI Layout grid.
#   radar_usrp_echotimer_cc
#       The transmit/receive pair for a real USRP, built on UHD, which is not in
#       the WASM sysroot and has no browser equivalent. No entry: it stays
#       Python-only and greyed out, like every other host-radio block here.
#   radar_trigger_command
#       Runs a shell command (std::system) when an estimate crosses a threshold.
#       A tab has no shell -- Emscripten's system() is a stub that fails -- so
#       rather than offer a block that silently never fires, no entry.
#
# The other browser-side notes are on the blocks they belong to, below.

# --- Generators -------------------------------------------------------------

radar_signal_generator_cw_c:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <radar/signal_generator_cw_c.h>']
    declarations: 'radar::signal_generator_cw_c::sptr ${id};'
    make: 'this->${id} = radar::signal_generator_cw_c::make(${packet_len}, ${samp_rate}, ${frequency}, ${amplitude}, ${len_key});'
    link: [gnuradio-radar]

radar_signal_generator_fmcw_c:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <radar/signal_generator_fmcw_c.h>']
    declarations: 'radar::signal_generator_fmcw_c::sptr ${id};'
    # Argument order is the make() signature's, not the dialog's: upstream's own
    # Python template passes samp_up/samp_down before samp_cw too.
    make: 'this->${id} = radar::signal_generator_fmcw_c::make(${samp_rate}, ${samp_up}, ${samp_down}, ${samp_cw}, ${freq_cw}, ${freq_sweep}, ${amplitude}, ${len_key});'
    link: [gnuradio-radar]

radar_signal_generator_fsk_c:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <radar/signal_generator_fsk_c.h>']
    declarations: 'radar::signal_generator_fsk_c::sptr ${id};'
    make: 'this->${id} = radar::signal_generator_fsk_c::make(${samp_rate}, ${samp_per_freq}, ${blocks_per_tag}, ${freq_low}, ${freq_high}, ${amplitude}, ${len_key});'
    link: [gnuradio-radar]

radar_signal_generator_sync_pulse_c:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <radar/signal_generator_sync_pulse_c.h>']
    declarations: 'radar::signal_generator_sync_pulse_c::sptr ${id};'
    make: 'this->${id} = radar::signal_generator_sync_pulse_c::make(${packet_len}, ${pulse_len}, ${pulse_pause}, ${pulse_amplitude}, ${len_key});'
    link: [gnuradio-radar]

