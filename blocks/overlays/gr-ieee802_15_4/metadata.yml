# Browser-only block metadata for bastibl/gr-ieee802-15-4.
#
# All 25 GRC blocks have native C++ implementations. Their generated factories
# live in the deferred ieee802_15_4 side module. Upstream's nested chip/codeword
# tables are `raw`; browser-only matrix dtypes make the editor resolve variable
# references while saved .grc files retain their native text. RIME vectors are
# narrowed by the helper beside this file with range checks.

ieee802_15_4_access_code_prefixer:
    flags: [python, cpp]
    cpp_templates:
        includes: ['#include <ieee802_15_4/access_code_prefixer.h>']
        declarations: ieee802_15_4::access_code_prefixer::sptr ${id};
        make: this->${id} = ieee802_15_4::access_code_prefixer::make(${pad}, ${preamble});
        link: [gnuradio-ieee802_15_4]

