# Browser-only block metadata for the vendored out-of-tree module gr-satellites.
#
# Keeping these overlays here instead of in the submodule's own .block.yml is what
# lets that submodule stay pinned to a pristine upstream commit: nothing in the
# checkout has to be edited, rebased, or pushed to a fork to add a block. See
# tools/block_overrides.py for the supported keys, and AGENTS.md for the
# out-of-tree checklist this file is step 3 of.
#
# By far the largest of these files: gr-satellites' demodulators, deframers and
# hierarchies are all Python with no C++ path upstream, so most entries below do
# not point at a vendored block at all. They point at the browser rebuilds in
# satellites_{blocks,hier,deframers}.cpp beside this file, each of which mirrors
# the Python file named in its comment there.
# At some point, look into upstreaming these.

# gr-satellites ships C++ implementations for its low-level coding, framing,
# FEC, and utility blocks, but most of its GRC metadata only declares Python
# generation. Keep upstream's main branch pristine and provide the equivalent
# browser-only C++ templates here.
satellites_ax100_decode:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <satellites/ax100_decode.h>']
    make: 'this->${id} = satellites::ax100_decode::make(${verbose});'

