# Browser-only block metadata for the vendored out-of-tree module gr-paint (drmpeg).
#
# Keeping these overlays here instead of in the submodule's own .block.yml is what
# lets that submodule stay pinned to a pristine upstream commit: nothing in the
# checkout has to be edited, rebased, or pushed to a fork to add a block. See
# tools/block_overrides.py for the supported keys, and AGENTS.md for the
# out-of-tree checklist this file is step 3 of.
#
# paint_bc is the module's only C++ block. paint_image_source is a Python
# gr.sync_block that decodes an image with PIL, which has no C++ path at all, so
# the browser decodes instead: registry.cpp registers it as a hand-written
# factory over paint_image_source.cpp beside this file (hence its id in CUSTOM_IDS and
# the absence of cpp_templates below) and the image is named either by URL or by
# a picture chosen from this computer, which the browser reads itself instead of
# resolving a filesystem path. The overlay here is only what that changes in the
# palette.
#
# Feeding paint_bc from a File Source holding raw luma bytes still works too --
# that is what gr-paint's own tgatoluma.c produces.

paint_image_source:
    # Upstream ships no `documentation`, and the Python docstring the palette
    # falls back to for the API section describes the PIL block this one
    # replaces. Say what actually happens here -- above all the CORS rule, which
    # is the one way a perfectly good image URL still fails.
    documentation: |-
        Produces monochrome image lines for the Spectrum Painter, which paints
        them into a receiver's waterfall.

        This build decodes the image with the browser rather than with
        Python-Imaging, and the image comes from either of two places:

        - a picture on this computer, chosen with Browse. The browser reads it
          directly, so nothing is uploaded anywhere; the binding lasts for this
          browser session only, and a saved .grc keeps just the file name, so
          re-opening it means choosing the picture again.
        - a URL, typed into the field. A relative URL resolves against this
          site, so /example_images/gnuradio_logo.png is the logo shipped with
          the "Paint a PNG Into a Waterfall" example.

        Formats: PNG, JPEG, GIF, WebP and BMP all work, from either source. SVG
        works too, rasterized at the size the file declares -- 300x150 pixels
        when it declares none, which is the browser's default for a sizeless
        SVG rather than anything chosen here. The Paint examples paint one
        image of each of the three formats worth demonstrating.

        CORS applies to the URL case only: this page is cross-origin isolated,
        so an image on another origin has to be served with permissive CORS
        headers (Access-Control-Allow-Origin). Wikimedia and most public CDNs
        are; an arbitrary web server, and most image links copied out of a
        browser's address bar, are not. There is no way around it from this
        side -- the browser refuses to read pixels it did not get permission
        for. A URL that is refused reports the reason in the console pane under
        the flowgraph. Anything served from this site, and every locally chosen
        picture, always works.

        An image wider than 4096 pixels is scaled down to 4096, the Spectrum
        Painter's limit. The decoded width is printed to the console when the
        flowgraph starts: type it into the Spectrum Painter's Image Width.
    parameter_labels:
        # Upstream's file_open dtype is kept: the picker it opens is the
        # browser's own file input, which needs no filesystem path (see the
        # local-file binding in editor/src/main.ts), and the same field also
        # accepts a URL.
        image_file: Image File or URL
    parameter_defaults:
        # Upstream defaults every one of these enums to a value absent from its
        # own options list ('False' against ['0','1'], 'Yes' against
        # ['0','1','2']), which native GRC tolerates and a <select> does not:
        # the property shows blank and the parameter reaches the runner empty.
        # Spell them as the options they meant.
        image_flip: '0'
        bt709_map: '1'
        image_invert: '0'
        autocontrast: '0'
        repeatmode: '1'

paint_paint_bc:
    flags: [python, cpp]
    cpp_templates:
        includes: ['#include <paint/paint_bc.h>']
        declarations: paint::paint_bc::sptr ${id};
        make: this->${id} = paint::paint_bc::make(${width}, ${repeats}, ${equalization.val},
            ${randomsrc.val}, ${randomsrc.ports});
        link: [gnuradio-paint]
        translations:
            paint\.: 'paint::'
