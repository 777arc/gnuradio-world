# Browser-only block metadata for the vendored out-of-tree module gr-rds.
#
# Keeping these overlays here instead of in the submodule's own .block.yml is what
# lets that submodule stay pinned to a pristine upstream commit: nothing in the
# checkout has to be edited, rebased, or pushed to a fork to add a block. See
# tools/block_overrides.py for the supported keys, and docs/adding-modules.md
# for the out-of-tree checklist this file is step 3 of.
#
# rds_panel needs no cpp_templates: it is a Python QWidget
# (gr-rds/python/rdspanel.py) and the only thing in an RDS receiver that ever
# displays the decoded ASCII, so runner/src/registry.cpp rebuilds it as a C++
# message-sink block with a hand-written factory. All it declares here is that
# the factory builds a widget, and so takes a tile in the GUI Layout grid.
# At some point, look into upstreaming these.

rds_panel:
  gui: true

rds_decoder:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <rds/decoder.h>']
    declarations: 'rds::decoder::sptr ${id};'
    make: 'this->${id} = rds::decoder::make(${log}, ${debug});'
    link: [gnuradio-rds]

rds_encoder:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <rds/encoder.h>']
    declarations: 'rds::encoder::sptr ${id};'
    make: 'this->${id} = rds::encoder::make(${pty_locale}, ${pty}, ${ms}, ${ps}, ${af1}, ${tp}, ${ta}, ${pi_country_code}, ${pi_coverage_area}, ${pi_reference_number}, ${radiotext}, ${max_latency});'
    link: [gnuradio-rds]
    callbacks: ['set_ps(${ps});']

rds_parser:
  flags: [python, cpp]
  parameter_dtypes:
    reset: int
  cpp_templates:
    includes: ['#include <rds/parser.h>']
    declarations: 'rds::parser::sptr ${id};'
    make: 'this->${id} = rds::parser::make(${log}, ${debug}, ${pty_locale});'
    link: [gnuradio-rds]

rds_tag_to_msg:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <rds/tag_to_msg.h>']
    declarations: 'rds::tag_to_msg::sptr ${id};'
    make: 'this->${id} = rds::tag_to_msg::make(${type.size}*${vlen});'
    link: [gnuradio-rds]
