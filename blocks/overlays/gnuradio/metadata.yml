# Browser-only block metadata for blocks in the GNU Radio tree itself, so the
# gnuradio/ submodule stays pinned to a pristine commit. The out-of-tree modules
# have a directory each under blocks/overlays/; this file is the in-tree
# equivalent, which needs no per-module split because gr/ is one submodule.
#
# Supported keys are documented in tools/block_overrides.py, which loads both.
# At some point, look into upstreaming these.

# gr-pdu's Tagged Stream to PDU ships valid cpp_templates but only declares
# Python generation, so the generator skips it (its PDU-to-stream counterpart
# does declare cpp). gr-satellites' scrambler hier blocks need the pair.
pdu_tagged_stream_to_pdu:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/pdu/tagged_stream_to_pdu.h>']
    declarations: 'pdu::tagged_stream_to_pdu::sptr ${id};'
    make: 'this->${id} = pdu::tagged_stream_to_pdu::make(${type.tv}, ${tag});'
    translations:
      pdu\.: 'pdu::'

# gr-pdu's PDU To Stream: a plain sync_block that drains PDUs into a stream. Only
# Python generation is declared upstream. It is the natural stream-side terminator
# for gr-satellites' message-only deframer chains.
pdu_pdu_to_stream_x:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/pdu/pdu_to_stream.h>']
    declarations: 'pdu::pdu_to_stream_${type.shortform}::sptr ${id};'
    make: 'this->${id} = pdu::pdu_to_stream_${type.shortform}::make(${early_behavior}, ${depth});'
    translations:
      pdu\.: 'pdu::'
    callbacks: ['set_max_queue_size(${depth});']

# The rest of gr-pdu is the same story: every one of these has a C++ impl in
# gr-pdu/lib, and upstream's yaml declares only Python generation for it. The
# PMT-valued keys and values (`pmt.intern("key")`) are retyped `pmt` so the
# runner parses them instead of the editor trying to evaluate them; their
# set_key/set_val callbacks are skipped by the generator, as natively a Range
# cannot drive a PMT either. Only pdu_pdu_lambda stays Python: it *is* a Python
# lambda, and the JS Block is the browser's answer to that.
pdu_take_skip_to_pdu:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/pdu/take_skip_to_pdu.h>']
    declarations: 'pdu::take_skip_to_pdu_${type.t}::sptr ${id};'
    make: 'this->${id} = pdu::take_skip_to_pdu_${type.t}::make(${take}, ${skip});'
    translations:
      pdu\.: 'pdu::'
    callbacks:
    - set_take(${take})
    - set_skip(${skip})

# `prepend` is typed `${type.vec_type}`, which for short and byte is upstream's
# generic int_vector; gen_registry.py's param_arg() maps it to the selected
# stream type so tags_to_pdu_s gets a std::vector<short>.
pdu_tags_to_pdu_x:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/pdu/tags_to_pdu.h>']
    declarations: 'pdu::tags_to_pdu_${type}::sptr ${id};'
    make: |-
      this->${id} = pdu::tags_to_pdu_${type}::make(pmt::intern(${start_tag}), pmt::intern(${end_tag}), ${max_pdu_size}, ${rate}, ${prepend}, ${pub_det}, ${tail_size}, ${start_time});
      this->${id}->set_eob_parameters(${eob_alignment}, ${eob_offset});
      this->${id}->enable_time_debug(${boost_time});
    translations:
      pdu\.: 'pdu::'
    callbacks:
    - set_max_pdu_size(${max_pdu_size})
    - set_samp_rate(${rate})
    - set_tail_size(${tail_size})
    - set_start_time(${start_time})
    - set_eob_parameters(${eob_alignment}, ${eob_offset})

pdu_random_pdu:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/pdu/random_pdu.h>']
    declarations: 'pdu::random_pdu::sptr ${id};'
    make: 'this->${id} = pdu::random_pdu::make(${minsize}, ${maxsize}, ${mask}, ${length_modulo});'
    translations:
      pdu\.: 'pdu::'

pdu_pdu_filter:
  flags: [python, cpp]
  parameter_dtypes:
    k: pmt
    v: pmt
  cpp_templates:
    includes: ['#include <gnuradio/pdu/pdu_filter.h>']
    declarations: 'pdu::pdu_filter::sptr ${id};'
    make: 'this->${id} = pdu::pdu_filter::make(${k}, ${v}, ${invert});'
    translations:
      pdu\.: 'pdu::'
    callbacks:
    - set_inversion(${invert})

pdu_pdu_set:
  flags: [python, cpp]
  parameter_dtypes:
    k: pmt
    v: pmt
  cpp_templates:
    includes: ['#include <gnuradio/pdu/pdu_set.h>']
    declarations: 'pdu::pdu_set::sptr ${id};'
    make: 'this->${id} = pdu::pdu_set::make(${k}, ${v});'
    translations:
      pdu\.: 'pdu::'

pdu_pdu_remove:
  flags: [python, cpp]
  parameter_dtypes:
    k: pmt
  cpp_templates:
    includes: ['#include <gnuradio/pdu/pdu_remove.h>']
    declarations: 'pdu::pdu_remove::sptr ${id};'
    make: 'this->${id} = pdu::pdu_remove::make(${k});'
    translations:
      pdu\.: 'pdu::'

pdu_pdu_split:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/pdu/pdu_split.h>']
    declarations: 'pdu::pdu_split::sptr ${id};'
    make: 'this->${id} = pdu::pdu_split::make(${pass_empty});'
    translations:
      pdu\.: 'pdu::'

pdu_add_system_time:
  flags: [python, cpp]
  parameter_dtypes:
    key: pmt
  cpp_templates:
    includes: ['#include <gnuradio/pdu/add_system_time.h>']
    declarations: 'pdu::add_system_time::sptr ${id};'
    make: 'this->${id} = pdu::add_system_time::make(${key});'
    translations:
      pdu\.: 'pdu::'

pdu_time_delta:
  flags: [python, cpp]
  parameter_dtypes:
    delta_key: pmt
    time_key: pmt
  cpp_templates:
    includes: ['#include <gnuradio/pdu/time_delta.h>']
    declarations: 'pdu::time_delta::sptr ${id};'
    make: 'this->${id} = pdu::time_delta::make(${delta_key}, ${time_key});'
    translations:
      pdu\.: 'pdu::'

# These blocks have a samp_rate parameter but upstream gives it no default (or a
# hardcoded one), unlike every other samp_rate param in the tree, which defaults
# to referencing the samp_rate variable block the editor places by default.
analog_fm_preemph:
  parameter_defaults:
    samp_rate: samp_rate

analog_fm_deemph:
  parameter_defaults:
    samp_rate: samp_rate

blocks_vco_f:
  parameter_defaults:
    samp_rate: samp_rate

blocks_vco_c:
  parameter_defaults:
    samp_rate: samp_rate

# Every QT GUI plot defaults to no title -- a plot in a browser tile is captioned
# by the flowgraph around it, and the title, when there is one, is drawn inside
# the canvas (blocks/src/qtgui_plot_title.hpp). The Matrix Sink is the one sink
# upstream gives a default Name, and until now it displayed it nowhere.
qtgui_matrix_sink:
  gui: true
  parameter_defaults:
    name: '""'

# gr-filter's Frequency Xlating FIR Filter has no cpp_templates upstream, only
# Python generation. Mirrors filter_fir_filter_xxx's shape. gr-satellites' AFSK
# and BPSK demodulators both use it.
freq_xlating_fir_filter_xxx:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/filter/freq_xlating_fir_filter.h>']
    declarations: 'filter::freq_xlating_fir_filter_${type}::sptr ${id};'
    make: 'this->${id} = filter::freq_xlating_fir_filter_${type}::make(${decim}, ${taps}, ${center_freq}, ${samp_rate});'
    link: ['gnuradio::gnuradio-filter']
    callbacks:
    - set_taps(${taps})
    - set_center_freq(${center_freq})

# gr-filter's two FFT filter conveniences (FFT Low Pass Filter, FFT Root Raised
# Cosine Filter) are fft_filter_${type} around a firdes tap design, exactly the
# shape of the FIR Low Pass Filter, which upstream did write cpp_templates for.
# The window option is spelled `window.WIN_*` and the translation rewrites it to
# the fft::window enumerator; wasm_registry::choice() normalizes `::` back to
# `.` when matching, so the editor's dotted value still selects it. The ccc
# variant takes complex taps, which Python's binding widened for it and
# wasm_registry::complex_taps() does here.
filter_fft_low_pass_filter:
  flags: [python, cpp]
  # Upstream types the window `raw` (the FIR Low Pass Filter's is `enum`), and a
  # raw parameter is one the editor evaluates on the Run path -- expr.ts knows
  # the window constants, so `window.WIN_HAMMING` would arrive as 0.
  parameter_dtypes:
    win: enum
  cpp_templates:
    includes: ['#include <gnuradio/filter/fft_filter_${type}.h>', '#include <gnuradio/filter/firdes.h>']
    declarations: 'filter::fft_filter_${type}::sptr ${id};'
    make: >-
      this->${id} = filter::fft_filter_${type}::make(${decim}, ${'wasm_registry::complex_taps' if str(type) == 'ccc' else ''}(filter::firdes::low_pass(${gain}, ${samp_rate}, ${cutoff_freq}, ${width}, ${win}, ${beta})), ${nthreads});
    translations:
      (?<!["\.])window\.: 'fft::window::'
    link: ['gnuradio::gnuradio-filter']
    callbacks:
    - >-
      set_taps(${'wasm_registry::complex_taps' if str(type) == 'ccc' else ''}(filter::firdes::low_pass(${gain}, ${samp_rate}, ${cutoff_freq}, ${width}, ${win}, ${beta})))

filter_fft_rrc_filter:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/filter/fft_filter_${type}.h>', '#include <gnuradio/filter/firdes.h>']
    declarations: 'filter::fft_filter_${type}::sptr ${id};'
    make: >-
      this->${id} = filter::fft_filter_${type}::make(${decim}, ${'wasm_registry::complex_taps' if str(type) == 'ccc' else ''}(filter::firdes::root_raised_cosine(${gain}, ${samp_rate}, ${sym_rate}, ${alpha}, ${ntaps})), ${nthreads});
    link: ['gnuradio::gnuradio-filter']
    callbacks:
    - >-
      set_taps(${'wasm_registry::complex_taps' if str(type) == 'ccc' else ''}(filter::firdes::root_raised_cosine(${gain}, ${samp_rate}, ${sym_rate}, ${alpha}, ${ntaps})))

# The PMT message and tag sources. All three have a C++ implementation in
# gr-blocks and no cpp_templates upstream, because their defining parameter is a
# PMT and GRC renders one by evaluating Python. The `pmt` dtype is this build's
# answer to that: the value stays the Python constructor call a .grc already
# carries (so the file round-trips to native GRC unchanged), and the runner
# parses it in wasm_registry::pmt_value() instead of evaluating it.
blocks_message_strobe:
  flags: [python, cpp]
  parameter_dtypes:
    msg: pmt
  cpp_templates:
    includes: ['#include <gnuradio/blocks/message_strobe.h>']
    declarations: 'blocks::message_strobe::sptr ${id};'
    make: 'this->${id} = blocks::message_strobe::make(${msg}, ${period});'

blocks_message_strobe_random:
  flags: [python, cpp]
  parameter_dtypes:
    msg: pmt
  cpp_templates:
    includes: ['#include <gnuradio/blocks/message_strobe_random.h>']
    declarations: 'blocks::message_strobe_random::sptr ${id};'
    make: 'this->${id} = blocks::message_strobe_random::make(${msg}, ${dist}, ${mean}, ${std});'
    translations:
      blocks\.: 'blocks::'

blocks_tags_strobe:
  flags: [python, cpp]
  parameter_dtypes:
    value: pmt
    key: pmt
  cpp_templates:
    includes: ['#include <gnuradio/blocks/tags_strobe.h>']
    declarations: 'blocks::tags_strobe::sptr ${id};'
    make: 'this->${id} = blocks::tags_strobe::make(${type.size}*${vlen}, ${value}, ${nsamps}, ${key});'

# Tag Object is a GRC *variable* holding one gr::tag_t, not a block, so it has no
# cpp_templates to give it: registry.cpp constructs it into the runtime tag
# registry and Vector Source's `tags` parameter names it. Retyped only so its
# three PMT fields are decoded rather than evaluated as arithmetic.
variable_tag_object:
  parameter_dtypes:
    key: pmt
    value: pmt
    src: pmt

# The QT GUI controls rebuilt from gr-qtgui's Python widgets
# (blocks/src/qtgui_controls.hpp). Each has a hand-written factory, so none needs
# cpp_templates; what they need is their Type parameter trimmed. The runner's
# variable model carries a double (BuiltBlock::variable_value), so a
# string-valued control has no value to publish and its factory throws by name --
# and an option the runtime always refuses does not belong in the palette.
variable_qtgui_toggle_switch:
  gui: true
  prune_options: ['string']

variable_qtgui_toggle_button_msg:
  gui: true
  prune_options: ['string']

variable_qtgui_msgcheckbox:
  gui: true
  prune_options: ['string']

variable_qtgui_msg_push_button:
  gui: true
  prune_options: ['string']

# ---------------------------------------------------------------------------
# Blocks whose hand-written factory in registry.cpp builds a QWidget, and which
# therefore occupy a tile in the runner window's GUI Layout grid. Upstream has no
# such notion -- native GRC places a widget with gui_hint, which does nothing here
# -- so `gui: true` is a browser-only fact and belongs in this overlay like any
# other. gen_registry.py collects it into the generated_blocks.json manifest,
# which is how the editor can lay a flowgraph out before it has ever been run.
#
# The blocks below need no other overlay key; the five that do carry `gui: true`
# beside it, above.
# ---------------------------------------------------------------------------

# gr-qtgui's sinks. Each needs a widget and live setters, so none is generated.
qtgui_time_sink_x:
  gui: true

qtgui_freq_sink_x:
  gui: true

qtgui_const_sink_x:
  gui: true

qtgui_waterfall_sink_x:
  gui: true

qtgui_number_sink:
  gui: true

qtgui_edit_box_msg:
  gui: true

qtgui_sink_x:
  gui: true

qtgui_eye_sink_x:
  gui: true

qtgui_histogram_sink_x:
  gui: true

qtgui_time_raster_sink_x:
  gui: true

qtgui_vector_sink_f:
  gui: true

qtgui_bercurve_sink:
  gui: true

qtgui_auto_correlator_sink:
  gui: true

# GRC's GUI Widgets/QT family: each is a variable *and* a widget, so it takes a
# tile like any sink. All Python QWidgets upstream, rebuilt in C++ at
# blocks/src/qtgui_controls.hpp.
variable_qtgui_range:
  gui: true

variable_qtgui_chooser:
  gui: true

variable_qtgui_push_button:
  gui: true

variable_qtgui_check_box:
  gui: true

variable_qtgui_entry:
  gui: true

variable_qtgui_label:
  gui: true

variable_qtgui_numeric_entry:
  gui: true

variable_qtgui_dial_control:
  gui: true

qtgui_msgdigitalnumbercontrol:
  gui: true

# ---------------------------------------------------------------------------
# In-tree Python gr.hier_block2 compositions, rebuilt in C++ under blocks/src/.
# Each of these is a chain of blocks the browser already has, held together by
# Python that this build has none of, so the rebuild is the same composition and
# the entry here is what points the generated factory at it. Blocks needing live
# setters or a coder object are hand-written in registry.cpp instead, and a
# hand-written factory needs no entry here at all.
# ---------------------------------------------------------------------------

# gr-digital's GFSK and GMSK modems (blocks/src/digital_hier.hpp). `verbose` and
# `log` only print and write .dat files upstream, so the rebuilds accept and
# ignore them rather than refusing a flowgraph that sets them.
digital_gfsk_mod:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <digital_hier.hpp>']
    make: 'auto block = GfskMod::make(${samples_per_symbol}, ${sensitivity}, ${bt}, ${do_unpack});'

digital_gfsk_demod:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <digital_hier.hpp>']
    make: 'auto block = GfskDemod::make(${samples_per_symbol}, ${sensitivity}, ${gain_mu}, ${omega_relative_limit}, ${freq_error});'

digital_gmsk_mod:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <digital_hier.hpp>']
    make: 'auto block = GmskMod::make(${samples_per_symbol}, ${bt}, ${do_unpack});'

digital_gmsk_demod:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <digital_hier.hpp>']
    make: 'auto block = GmskDemod::make(${samples_per_symbol}, ${gain_mu}, ${omega_relative_limit}, ${freq_error});'

# Not a hier block at all: gr-digital's GMSK Modulator is the C++ cpmmod_bc with
# the CPM type and modulation index fixed, and upstream simply never declared
# cpp_templates for it.
digital_gmskmod_bc:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/digital/cpmmod_bc.h>']
    make: 'auto block = digital::cpmmod_bc::make_gmskmod_bc(${samples_per_symbol}, ${L}, ${bt});'

# gr-analog's FM Detector is C++ (fmdet_cf_impl.cc) with Python-only yaml.
analog_fmdet_cf:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/analog/fmdet_cf.h>']
    declarations: 'analog::fmdet_cf::sptr ${id};'
    make: 'this->${id} = analog::fmdet_cf::make(${samplerate}, ${freq_low}, ${freq_high}, ${scl});'
    link: ['gnuradio::gnuradio-analog']
    callbacks:
    - set_scale(${scl})
    - set_freq_range(${freq_low}, ${freq_high})

# Multiply by Matrix ships cpp_templates upstream but flags only Python, and its
# matrix is `raw`. `complex_matrix` is the browser-only dtype the generator
# renders as wasm_registry::matrix<gr_complex>(), which reads real or [re, im]
# entries, so one dtype serves both the float and complex variants; the
# editor evaluates the nested sequence (variable references included) and
# derives the port counts from len(A) and len(A[0]).
blocks_multiply_matrix_xx:
  flags: [python, cpp]
  parameter_dtypes:
    A: complex_matrix
  cpp_templates:
    includes: ['#include <gnuradio/blocks/multiply_matrix.h>']
    declarations: 'blocks::multiply_matrix_${type.fcn}::sptr ${id};'
    make: 'this->${id} = blocks::multiply_matrix_${type.fcn}::make(${A}, ${tag_propagation_policy});'
    # The TPP enumerators are members of gr::block, which the generic gr. ->
    # gr:: rewrite cannot know; the choice() match keys keep their dotted
    # spelling so the editor's value still selects one.
    translations:
      gr::TPP_: 'gr::block::TPP_'
    callbacks: []

# gr-blocks' two hier blocks (blocks/src/blocks_hier.hpp).
blocks_matrix_interleaver:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <blocks_hier.hpp>']
    make: 'auto block = MatrixInterleaver::make(${type.size} * ${vlen}, ${rows}, ${cols}, ${deint});'
    callbacks: []

blocks_stream_to_vector_decimator:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <blocks_hier.hpp>']
    make: 'auto block = StreamToVectorDecimator::make(${type.size}, ${sample_rate}, ${vec_rate}, ${vlen});'

# gr-vocoder's CVSD wrappers (blocks/src/vocoder_hier.hpp). The vocoder blocks
# they wrap are C++ already.
vocoder_cvsd_encode_fb:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <vocoder_hier.hpp>']
    make: 'auto block = CvsdEncode::make(${resample}, ${bw});'

vocoder_cvsd_decode_bf:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <vocoder_hier.hpp>']
    make: 'auto block = CvsdDecode::make(${resample}, ${bw});'

# gr-dtv's ATSC receiver (blocks/src/dtv_hier.hpp). Every block in it is C++;
# only the wiring was Python.
dtv_atsc_rx_filter:
  flags: [cpp]
  cpp_templates:
    includes: ['#include <dtv_hier.hpp>']
    make: 'auto block = AtscRxFilter::make(${rate}, ${sps});'

dtv_atsc_rx:
  flags: [cpp]
  cpp_templates:
    includes: ['#include <dtv_hier.hpp>']
    make: 'auto block = AtscRx::make(${rate}, ${sps});'

# gr-channels has no cpp_templates upstream at all -- the whole component is
# Python-generated -- so every one of its blocks needs its C++ spelling supplied
# here. The three below are the ones the propagation examples need: the generic
# channel model (AWGN + CFO + timing offset + a static tap set) and the two
# Rayleigh/Rician fading models. Their impls are pure gr-analog/gr-filter/VOLK,
# so the `channels` side module needs no module_deps entry.
channels_channel_model:
  flags: [python, cpp]
  # Upstream defaults Taps to the scalar 1.0, which Python coerces to a
  # one-element vector on the way into the constructor. wasm_registry::vector
  # does not, so the default becomes the list it has to be.
  parameter_defaults:
    taps: '[1.0]'
  cpp_templates:
    includes: ['#include <gnuradio/channels/channel_model.h>']
    declarations: 'channels::channel_model::sptr ${id};'
    make: 'this->${id} = channels::channel_model::make(${noise_voltage}, ${freq_offset}, ${epsilon}, ${taps}, ${seed}, ${block_tags});'
    link: ['gnuradio::gnuradio-channels']
    callbacks:
    - set_noise_voltage(${noise_voltage})
    - set_frequency_offset(${freq_offset})
    - set_taps(${taps})
    - set_timing_offset(${epsilon})

channels_fading_model:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/channels/fading_model.h>']
    declarations: 'channels::fading_model::sptr ${id};'
    make: 'this->${id} = channels::fading_model::make(${N}, ${fDTs}, ${LOS}, ${K}, ${seed});'
    link: ['gnuradio::gnuradio-channels']
    callbacks:
    - set_fDTs(${fDTs})
    - set_K(${K})

channels_selective_fading_model:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/channels/selective_fading_model.h>']
    declarations: 'channels::selective_fading_model::sptr ${id};'
    make: 'this->${id} = channels::selective_fading_model::make(${N}, ${fDTs}, ${LOS}, ${K}, ${seed}, ${delays}, ${mags}, ${ntaps});'
    link: ['gnuradio::gnuradio-channels']
    callbacks:
    - set_fDTs(${fDTs})
    - set_K(${K})

# The rest of gr-channels' C++: the two random-walk offset models, the
# tag-aware channel model, the fading model with per-ray delay drift, and the
# hier block composing all of them. Same story as above -- all C++ upstream,
# only Python generation declared.
channels_cfo_model:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/channels/cfo_model.h>']
    declarations: 'channels::cfo_model::sptr ${id};'
    make: 'this->${id} = channels::cfo_model::make(${srate}, ${stdev}, ${maxdev}, ${seed});'
    link: ['gnuradio::gnuradio-channels']
    callbacks:
    - set_std_dev(${stdev})
    - set_max_dev(${maxdev})
    - set_samp_rate(${srate})

channels_sro_model:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/channels/sro_model.h>']
    declarations: 'channels::sro_model::sptr ${id};'
    make: 'this->${id} = channels::sro_model::make(${srate}, ${stdev}, ${maxdev}, ${seed});'
    link: ['gnuradio::gnuradio-channels']
    callbacks:
    - set_std_dev(${stdev})
    - set_max_dev(${maxdev})
    - set_samp_rate(${srate})

channels_channel_model2:
  flags: [python, cpp]
  # Same scalar-to-vector coercion as channels_channel_model's Taps.
  parameter_defaults:
    taps: '[1.0]'
  cpp_templates:
    includes: ['#include <gnuradio/channels/channel_model2.h>']
    declarations: 'channels::channel_model2::sptr ${id};'
    make: 'this->${id} = channels::channel_model2::make(${noise_voltage}, ${epsilon}, ${taps}, ${seed}, ${block_tags});'
    link: ['gnuradio::gnuradio-channels']
    callbacks:
    - set_noise_voltage(${noise_voltage})
    - set_taps(${taps})
    - set_timing_offset(${epsilon})

channels_selective_fading_model2:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/channels/selective_fading_model2.h>']
    declarations: 'channels::selective_fading_model2::sptr ${id};'
    make: 'this->${id} = channels::selective_fading_model2::make(${N}, ${fDTs}, ${LOS}, ${K}, ${seed}, ${delays}, ${delay_std}, ${delay_maxdev}, ${mags}, ${ntaps});'
    link: ['gnuradio::gnuradio-channels']
    callbacks:
    - set_fDTs(${fDTs})
    - set_K(${K})

channels_dynamic_channel_model:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/channels/dynamic_channel_model.h>']
    declarations: 'channels::dynamic_channel_model::sptr ${id};'
    make: 'this->${id} = channels::dynamic_channel_model::make(${samp_rate}, ${sro_stdev}, ${sro_maxdev}, ${cfo_stdev}, ${cfo_maxdev}, ${N}, ${fD}, ${LOS}, ${K}, ${delays}, ${mags}, ${ntaps}, ${noise_amp}, ${seed});'
    link: ['gnuradio::gnuradio-channels']
    callbacks:
    - set_samp_rate(${samp_rate})
    - set_sro_dev_std(${sro_stdev})
    - set_sro_dev_max(${sro_maxdev})
    - set_cfo_dev_std(${cfo_stdev})
    - set_cfo_dev_max(${cfo_maxdev})
    - set_noise_amp(${noise_amp})
    - set_doppler_freq(${fD})
    - set_K(${K})

# gr-digital's MPSK SNR Estimator names a setter its C++ class does not have:
# both callback lists say set_tag_nsamples, the class declares set_tag_nsample.
# Upstream never noticed because GRC's Python generator only emits the text.
digital_mpsk_snr_est_cc:
  callbacks:
  - set_type(${type})
  - set_tag_nsample(${tag_nsamples})
  - set_alpha(${alpha})

# gr-audio's two blocks reach the sound card through Web Audio here, so
# upstream's ALSA advice ("plughw:0,0") describes a device layer that does not
# exist in a tab. Everything else about them -- ids, parameters, ports -- is
# upstream's. The C++ is blocks/src/browser_audio.cpp; see docs/audio.md.
audio_sink:
  parameter_labels:
    device_name: Output Device
  documentation: |-
    Plays its input through the browser's audio output, at the given sample
    rate. One input per channel: set Num Inputs to 2 for stereo.

    The sample rate is what the flowgraph feeds this block, and the browser
    resamples it to whatever the sound card runs at. Any rate from 3 kHz to
    384 kHz is accepted.

    Leave Output Device blank for the system default. A name here is matched
    against the browser's audio output devices, by device id or by any part of
    the device label; choosing an output device needs Chrome 110 or newer, and
    device labels only become readable once the page has been granted
    microphone permission.

    Like the native block, this one is the flowgraph's clock: it blocks until
    the sound card has taken the samples, which is what paces the graph in real
    time. Turn OK to Block off to let it run free instead -- it then discards
    whatever the device cannot take and paces the flowgraph by the wall clock.

    Browsers do not allow sound to start until the page has been interacted
    with. If the flowgraph starts before that, the audio is silent (and the
    editor says so) until you click the page; the rest of the flowgraph keeps
    running at its real rate meanwhile.

audio_source:
  parameter_labels:
    device_name: Input Device
  documentation: |-
    Captures from the browser's audio input -- the microphone, or any input
    device the browser can open -- at the given sample rate. One output per
    channel: set Num Outputs to 2 for stereo. A mono device feeding a stereo
    block gives both outputs the same samples.

    Echo cancellation, noise suppression and automatic gain are all turned off:
    this is a signal path, not a voice call.

    The browser asks for microphone permission when the flowgraph is run, and
    remembers the answer for this site. Leave Input Device blank for the system
    default; a name here is matched against the browser's audio input devices,
    by device id or by any part of the device label.
