# Browser-only block metadata for blocks in the GNU Radio tree itself, so the
# gnuradio/ submodule stays pinned to a pristine commit. The out-of-tree modules
# have a directory each under blocks/overlays/; this file is the in-tree
# equivalent, which needs no per-module split because gr/ is one submodule.
#
# Supported keys are documented in tools/block_overrides.py, which loads both.
# At some point, look into upstreaming these.

# gr-pdu's Tagged Stream to PDU ships valid cpp_templates but only declares
# Python generation, so the generator skips it (its PDU-to-stream counterpart
# does declare cpp). gr-satellites' scrambler hier blocks need the pair.
pdu_tagged_stream_to_pdu:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/pdu/tagged_stream_to_pdu.h>']
    declarations: 'pdu::tagged_stream_to_pdu::sptr ${id};'
    make: 'this->${id} = pdu::tagged_stream_to_pdu::make(${type.tv}, ${tag});'
    translations:
      pdu\.: 'pdu::'

# gr-pdu's PDU To Stream: a plain sync_block that drains PDUs into a stream. Only
# Python generation is declared upstream. It is the natural stream-side terminator
# for gr-satellites' message-only deframer chains.
pdu_pdu_to_stream_x:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/pdu/pdu_to_stream.h>']
    declarations: 'pdu::pdu_to_stream_${type.shortform}::sptr ${id};'
    make: 'this->${id} = pdu::pdu_to_stream_${type.shortform}::make(${early_behavior}, ${depth});'
    translations:
      pdu\.: 'pdu::'
    callbacks: ['set_max_queue_size(${depth});']

# These blocks have a samp_rate parameter but upstream gives it no default (or a
# hardcoded one), unlike every other samp_rate param in the tree, which defaults
# to referencing the samp_rate variable block the editor places by default.
analog_fm_preemph:
  parameter_defaults:
    samp_rate: samp_rate

analog_fm_deemph:
  parameter_defaults:
    samp_rate: samp_rate

blocks_vco_f:
  parameter_defaults:
    samp_rate: samp_rate

blocks_vco_c:
  parameter_defaults:
    samp_rate: samp_rate

# gr-filter's Frequency Xlating FIR Filter has no cpp_templates upstream, only
# Python generation. Mirrors filter_fir_filter_xxx's shape. gr-satellites' AFSK
# and BPSK demodulators both use it.
freq_xlating_fir_filter_xxx:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/filter/freq_xlating_fir_filter.h>']
    declarations: 'filter::freq_xlating_fir_filter_${type}::sptr ${id};'
    make: 'this->${id} = filter::freq_xlating_fir_filter_${type}::make(${decim}, ${taps}, ${center_freq}, ${samp_rate});'
    link: ['gnuradio::gnuradio-filter']
    callbacks:
    - set_taps(${taps})
    - set_center_freq(${center_freq})

# The PMT message and tag sources. All three have a C++ implementation in
# gr-blocks and no cpp_templates upstream, because their defining parameter is a
# PMT and GRC renders one by evaluating Python. The `pmt` dtype is this build's
# answer to that: the value stays the Python constructor call a .grc already
# carries (so the file round-trips to native GRC unchanged), and the runner
# parses it in wasm_registry::pmt_value() instead of evaluating it.
blocks_message_strobe:
  flags: [python, cpp]
  parameter_dtypes:
    msg: pmt
  cpp_templates:
    includes: ['#include <gnuradio/blocks/message_strobe.h>']
    declarations: 'blocks::message_strobe::sptr ${id};'
    make: 'this->${id} = blocks::message_strobe::make(${msg}, ${period});'

blocks_message_strobe_random:
  flags: [python, cpp]
  parameter_dtypes:
    msg: pmt
  cpp_templates:
    includes: ['#include <gnuradio/blocks/message_strobe_random.h>']
    declarations: 'blocks::message_strobe_random::sptr ${id};'
    make: 'this->${id} = blocks::message_strobe_random::make(${msg}, ${dist}, ${mean}, ${std});'
    translations:
      blocks\.: 'blocks::'

blocks_tags_strobe:
  flags: [python, cpp]
  parameter_dtypes:
    value: pmt
    key: pmt
  cpp_templates:
    includes: ['#include <gnuradio/blocks/tags_strobe.h>']
    declarations: 'blocks::tags_strobe::sptr ${id};'
    make: 'this->${id} = blocks::tags_strobe::make(${type.size}*${vlen}, ${value}, ${nsamps}, ${key});'

# Tag Object is a GRC *variable* holding one gr::tag_t, not a block, so it has no
# cpp_templates to give it: registry.cpp constructs it into the runtime tag
# registry and Vector Source's `tags` parameter names it. Retyped only so its
# three PMT fields are decoded rather than evaluated as arithmetic.
variable_tag_object:
  parameter_dtypes:
    key: pmt
    value: pmt
    src: pmt

# The QT GUI controls rebuilt from gr-qtgui's Python widgets
# (blocks/src/qtgui_controls.hpp). Each has a hand-written factory, so none needs
# cpp_templates; what they need is their Type parameter trimmed. The runner's
# variable model carries a double (BuiltBlock::variable_value), so a
# string-valued control has no value to publish and its factory throws by name --
# and an option the runtime always refuses does not belong in the palette.
variable_qtgui_toggle_switch:
  prune_options: ['string']

variable_qtgui_toggle_button_msg:
  prune_options: ['string']

variable_qtgui_msgcheckbox:
  prune_options: ['string']

variable_qtgui_msg_push_button:
  prune_options: ['string']

# ---------------------------------------------------------------------------
# In-tree Python gr.hier_block2 compositions, rebuilt in C++ under blocks/src/.
# Each of these is a chain of blocks the browser already has, held together by
# Python that this build has none of, so the rebuild is the same composition and
# the entry here is what points the generated factory at it. Blocks needing live
# setters or a coder object are hand-written in registry.cpp instead and appear
# in gen_registry.py's CUSTOM_IDS rather than here.
# ---------------------------------------------------------------------------

# gr-digital's GFSK and GMSK modems (blocks/src/digital_hier.hpp). `verbose` and
# `log` only print and write .dat files upstream, so the rebuilds accept and
# ignore them rather than refusing a flowgraph that sets them.
digital_gfsk_mod:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <digital_hier.hpp>']
    make: 'auto block = GfskMod::make(${samples_per_symbol}, ${sensitivity}, ${bt}, ${do_unpack});'

digital_gfsk_demod:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <digital_hier.hpp>']
    make: 'auto block = GfskDemod::make(${samples_per_symbol}, ${sensitivity}, ${gain_mu}, ${omega_relative_limit}, ${freq_error});'

digital_gmsk_mod:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <digital_hier.hpp>']
    make: 'auto block = GmskMod::make(${samples_per_symbol}, ${bt}, ${do_unpack});'

digital_gmsk_demod:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <digital_hier.hpp>']
    make: 'auto block = GmskDemod::make(${samples_per_symbol}, ${gain_mu}, ${omega_relative_limit}, ${freq_error});'

# Not a hier block at all: gr-digital's GMSK Modulator is the C++ cpmmod_bc with
# the CPM type and modulation index fixed, and upstream simply never declared
# cpp_templates for it.
digital_gmskmod_bc:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <gnuradio/digital/cpmmod_bc.h>']
    make: 'auto block = digital::cpmmod_bc::make_gmskmod_bc(${samples_per_symbol}, ${L}, ${bt});'

# gr-blocks' two hier blocks (blocks/src/blocks_hier.hpp).
blocks_matrix_interleaver:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <blocks_hier.hpp>']
    make: 'auto block = MatrixInterleaver::make(${type.size} * ${vlen}, ${rows}, ${cols}, ${deint});'

blocks_stream_to_vector_decimator:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <blocks_hier.hpp>']
    make: 'auto block = StreamToVectorDecimator::make(${type.size}, ${sample_rate}, ${vec_rate}, ${vlen});'

# gr-vocoder's CVSD wrappers (blocks/src/vocoder_hier.hpp). The vocoder blocks
# they wrap are C++ already.
vocoder_cvsd_encode_fb:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <vocoder_hier.hpp>']
    make: 'auto block = CvsdEncode::make(${resample}, ${bw});'

vocoder_cvsd_decode_bf:
  flags: [python, cpp]
  cpp_templates:
    includes: ['#include <vocoder_hier.hpp>']
    make: 'auto block = CvsdDecode::make(${resample}, ${bw});'

# gr-dtv's ATSC receiver (blocks/src/dtv_hier.hpp). Every block in it is C++;
# only the wiring was Python.
dtv_atsc_rx_filter:
  flags: [cpp]
  cpp_templates:
    includes: ['#include <dtv_hier.hpp>']
    make: 'auto block = AtscRxFilter::make(${rate}, ${sps});'

dtv_atsc_rx:
  flags: [cpp]
  cpp_templates:
    includes: ['#include <dtv_hier.hpp>']
    make: 'auto block = AtscRx::make(${rate}, ${sps});'
