# Browser-only C++ factory metadata for ptrkrysik/gr-gsm. The upstream checkout
# stays pristine; the four file readers/writers and TMSI Dumper are deliberately
# absent because their host-filesystem behavior has no browser binding. The
# The four upstream Python hierarchies are rebuilt as C++ hier_block2 classes in
# gsm_hier.cpp so every non-filesystem block has a browser runtime path.

gsm_bcch_ccch_demapper:
    flags: [python, cpp]
    parameter_dtypes:
        timeslot_nr: int
    cpp_templates:
        includes: ['#include "gsm_hier.hpp"']
        declarations: 'wasm_gsm::bcch_ccch_demapper::sptr ${id};'
        make: 'this->${id} = wasm_gsm::bcch_ccch_demapper::make(${timeslot_nr});'
        link: [gnuradio-gsm]

