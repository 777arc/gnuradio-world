<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>runner</title>
    <style>
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      body { position: relative; }
      /* Qt reads its container geometry while runner_entry() starts. Keep the
         screen measurable during loading: display:none makes Qt start against
         stale/default geometry, and the grid is then corrected only by the
         next browser resize. The spinner covers the hidden screen instead. */
      #screen { width: 100%; height: 100%; visibility: hidden; }
      #qtspinner {
        position: absolute; inset: 0; z-index: 1; margin: 0; background: white;
        display: flex; align-items: center; justify-content: center;
      }
      #qtspinner figcaption { display: flex; flex-direction: column; align-items: center; }
      #qtspinner img { display: block; width: min(60vw, 640px); height: auto; }
      #qtstatus { margin-top: 1em; font-size: 1.5em; }
    </style>
  </head>
  <body onload="init()">
    <figure id="qtspinner">
      <figcaption>
        <img src="gnuradio_world_logo.svg"></img>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </figcaption>
    </figure>
    <div id="screen"></div>

    <script type="text/javascript">
      // Emscripten evaluates PTHREAD_POOL_SIZE when runner_entry() starts, so
      // select the prewarmed tier now, before runner.js is instantiated by Qt.
      // One worker is reserved for the detached top-block run thread; GNU Radio
      // then normally creates one scheduler worker per stream block. Counting
      // every top-level GRC block is intentionally conservative because some are
      // variables rather than scheduler blocks. Hierarchies can expand the other
      // way, in which case PTHREAD_POOL_SIZE_STRICT=0 permits extra workers.
      // Round up to a multiple of 8 rather than to a coarse power of two. Each
      // prewarmed worker costs ~50-100 ms (it loads the module, and with
      // MAIN_MODULE any side modules too), so the old 32 -> 256 step meant a
      // 33-worker flowgraph spent ~28 s spawning workers before its first
      // sample. The 8 of slack is deliberate: it absorbs a miscount here — the
      // top-level block count over-counts variables and under-counts hierarchy
      // expansion — so a late thread request finds an unused worker instead of
      // proxying a Worker allocation to the main thread. Keep worker_tier_for()
      // in runner.cpp rounding identically, or its pre-start top-up re-inflates
      // the pool to whatever ladder it uses and this buys nothing.
      function poolTierForBlockCount(blockCount) {
        const requiredWorkers = Math.max(0, Number(blockCount) || 0) + 1;
        return Math.min(256, Math.max(8, Math.ceil(requiredWorkers / 8) * 8));
      }

      function flowgraphBlockCount() {
        if (!location.hash || location.hash.length <= 1) return 0;
        try {
          const grc = decodeURIComponent(location.hash.substring(1));
          const start = grc.search(/^blocks:\s*$/m);
          if (start < 0) return 0;
          const afterStart = grc.substring(start).replace(/^blocks:\s*\n?/, '');
          const end = afterStart.search(/^(?:connections|metadata):\s*$/m);
          const blockSection = end < 0 ? afterStart : afterStart.substring(0, end);
          return (blockSection.match(/^-\s+name\s*:/gm) || []).length;
        } catch (error) {
          console.warn('Could not size pthread tier from flowgraph:', error);
          return 0;
        }
      }

      function flowgraphUsesFosphorSink() {
        if (!location.hash || location.hash.length <= 1) return false;
        try {
          const grc = decodeURIComponent(location.hash.substring(1));
          return /^\s*id:\s*fosphor_qt_sink_c\s*$/m.test(grc);
        } catch (error) {
          return false;
        }
      }

      window.__grPoolTierForBlockCount = poolTierForBlockCount;
      window.__grFlowgraphBlockCount = flowgraphBlockCount();
      window.__grPoolTier = poolTierForBlockCount(window.__grFlowgraphBlockCount);

      // The one-time payload the editor hands over: files a source reads, and
      // the destinations a sink writes. Both arrive in the same array, keyed by
      // the paths the blocks resolve their bindings through.
      function bindingsForRun() {
        const token = new URLSearchParams(location.search).get('recordingToken');
        if (!token) return { inputs: [], outputs: [] };
        if (window.parent === window ||
            typeof window.parent.__grTakeRecordingFiles !== 'function')
          throw new Error('browser file bindings are unavailable');

        const inputs = [];
        const outputs = [];
        for (const descriptor of window.parent.__grTakeRecordingFiles(token)) {
          if (typeof descriptor.path !== 'string')
            throw new Error('invalid browser file path');

          // A SigMF Sink's destination: a folder handle to stream into, or
          // nothing at all, in which case the writer buffers and downloads.
          if (descriptor.kind === 'output') {
            if (!descriptor.path.startsWith('/local-output/'))
              throw new Error('invalid browser output path');
            if (typeof descriptor.base !== 'string' || !descriptor.base)
              throw new Error('invalid browser output name');
            const streaming = !!descriptor.dir &&
              typeof descriptor.dir.getFileHandle === 'function';
            outputs.push({
              kind: streaming ? 'fsaccess' : 'download',
              path: descriptor.path,
              base: descriptor.base,
              dir: streaming ? descriptor.dir : null,
            });
            continue;
          }

          if (!descriptor.path.startsWith('/recordings/') &&
              !descriptor.path.startsWith('/local-files/'))
            throw new Error('invalid browser file path');
          // Accept the old {blob} shape during local development so an editor
          // and runner rebuilt in either order fail gracefully.
          if (descriptor.kind === 'local' || descriptor.blob) {
            const file = descriptor.file || descriptor.blob;
            if (!file || typeof file.slice !== 'function' ||
                !Number.isSafeInteger(file.size))
              throw new Error('invalid local browser file');
            inputs.push({
              kind: 'local', path: descriptor.path, file, size: file.size,
              // SigMF Source binds the .sigmf-meta text beside the samples; the
              // block's factory reads it from here to build its tag plan.
              meta: typeof descriptor.meta === 'string' ? descriptor.meta : undefined,
            });
            continue;
          }
          if (descriptor.kind === 'http') {
            if (typeof descriptor.url !== 'string' ||
                !Number.isSafeInteger(descriptor.size) || descriptor.size < 0)
              throw new Error('invalid remote browser file');
            inputs.push({
              kind: 'http',
              path: descriptor.path,
              url: new URL(descriptor.url, location.href).href,
              size: descriptor.size,
              meta: typeof descriptor.meta === 'string' ? descriptor.meta : undefined,
            });
            continue;
          }
          throw new Error('unknown browser file source');
        }
        return { inputs, outputs };
      }

      // BrowserFileSource.start() is called from GNU Radio's scheduler-launch
      // pthread and proxies here only to create a dedicated reader worker. The
      // reader and DSP block then communicate exclusively through atomics in a
      // fixed-size ring in shared WebAssembly.Memory.
      let nextFileReaderId = 1;
      const fileReaders = new Map();
      window.__grFileStats = Object.create(null);
      window.__grStartBrowserFileSource = (
        path, memory, ringPointer, capacityItems, itemSize,
        controlPointer, errorPointer, offsetItems, lengthItems, repeat
      ) => {
        const source = window.__grInputSources && window.__grInputSources[path];
        if (!source) throw new Error(`file is not bound in this session: ${path}`);
        const id = nextFileReaderId++;
        const workerUrl = new URL('browser_file_reader.js', location.href);
        if (window.__grBuildStamp) workerUrl.searchParams.set('v', window.__grBuildStamp);
        const worker = new Worker(workerUrl);
        const stats = {
          path,
          ringBytes: capacityItems * itemSize,
          maxChunkBytes: 0,
          bytesRead: 0,
          state: 'starting',
        };
        window.__grFileStats[id] = stats;
        fileReaders.set(id, worker);
        worker.onmessage = event => {
          const message = event.data || {};
          if (Number.isFinite(message.bytesRead)) stats.bytesRead = message.bytesRead;
          if (Number.isFinite(message.maxChunkBytes))
            stats.maxChunkBytes = Math.max(stats.maxChunkBytes, message.maxChunkBytes);
          if (message.type) stats.state = message.type;
          if (message.type === 'error') console.error(`File Source ${path}: ${message.message}`);
          if (message.type === 'eof' || message.type === 'cancelled' || message.type === 'error')
            fileReaders.delete(id);
        };
        worker.onerror = event => {
          stats.state = 'error';
          console.error(`File Source worker ${path}: ${event.message || 'worker error'}`);
          fileReaders.delete(id);
        };
        worker.postMessage({
          source,
          memory,
          ringPointer,
          capacityItems,
          itemSize,
          controlPointer,
          errorPointer,
          errorCapacity: 512,
          offsetItems,
          lengthItems,
          repeat,
        });
        stats.state = 'running';
        return id;
      };
      // RtlSdrSource.start() proxies here for the same reason, and the reader
      // it launches owns the USBDevice for as long as the flowgraph runs. The
      // permission itself is granted by the editor on a user gesture before the
      // graph starts; this worker only re-acquires it through getDevices().
      // See docs/rtlsdr.md.
      let nextRtlReaderId = 1;
      const rtlReaders = new Map();
      // The worker messages that say where a run *is*, as opposed to the ones
      // that report on a run already under way. Shared by every USB worker.
      const USB_WORKER_STATES = new Set(['running', 'cancelled', 'error']);
      window.__grUsbStats = Object.create(null);
      // A USB worker's failure, followed by the operations that led to it.
      // console.group keeps that flight recorder from burying everything else.
      const reportUsbWorkerError = (label, message) => {
        console.error(`${label}: ${message.message}`);
        if (message.recent && message.recent.length) {
          console.groupCollapsed(
            `${label}: last ${message.recent.length} USB operations`);
          for (const line of message.recent) console.log(line);
          console.groupEnd();
        }
      };
      window.__grStartRtlSdrSource = (
        serial, memory, ringPointer, capacityPairs,
        controlPointer, errorPointer, sampleRate, directSampling, bufflen
      ) => {
        const id = nextRtlReaderId++;
        const workerUrl = new URL('rtlsdr_reader.js', location.href);
        if (window.__grBuildStamp) workerUrl.searchParams.set('v', window.__grBuildStamp);
        const worker = new Worker(workerUrl);
        const label = serial || 'first available';
        const stats = {
          device: 'RTL-SDR',
          direction: 'rx',
          serial: label,
          ringBytes: capacityPairs * 2,
          requestedRate: sampleRate,
          actualRate: 0,
          bytesRead: 0,
          overruns: 0,
          droppedPairs: 0,
          state: 'starting',
        };
        window.__grUsbStats[id] = stats;
        rtlReaders.set(id, worker);
        worker.onmessage = event => {
          const message = event.data || {};
          if (Number.isFinite(message.bytesRead)) stats.bytesRead = message.bytesRead;
          if (Number.isFinite(message.overruns)) stats.overruns = message.overruns;
          if (Number.isFinite(message.droppedPairs))
            stats.droppedPairs = message.droppedPairs;
          if (Number.isFinite(message.actualRate)) stats.actualRate = message.actualRate;
          // Tracing is a running commentary, not a state, and it is the one
          // message expected to arrive in bulk.
          if (message.type === 'trace') {
            console.log(`RTL-SDR ${label}| ${message.text}`);
            return;
          }
          // Only a lifecycle message moves `state`. 'tuner', 'progress' and
          // 'overrun' all report on a reader that is still running, so letting
          // them through would leave the debug panel showing a graph that had
          // merely passed 16 MB as though 'progress' were where it had stopped.
          if (USB_WORKER_STATES.has(message.type)) stats.state = message.type;
          if (message.type === 'tuner')
            console.log(`RTL-SDR Source ${label}: tuner ${message.tuner}, ` +
                        `${message.manufacturer || '?'} / ${message.model || '?'}`);
          if (message.type === 'error')
            reportUsbWorkerError(`RTL-SDR Source ${label}`, message);
          if (message.type === 'cancelled' || message.type === 'error')
            rtlReaders.delete(id);
        };
        worker.onerror = event => {
          stats.state = 'error';
          console.error(
            `RTL-SDR Source worker ${label}: ${event.message || 'worker error'}`);
          rtlReaders.delete(id);
        };
        worker.postMessage({
          serial,
          memory,
          ringPointer,
          capacityPairs,
          controlPointer,
          errorPointer,
          errorCapacity: 512,
          sampleRate,
          directSampling,
          bufflen,
        });
        return id;
      };
      window.__grStopRtlSdrSource = id => {
        const worker = rtlReaders.get(id);
        // The worker closes itself on the CANCELLED state the block sets before
        // calling this, which is what lets it release the USB interface first.
        // Terminating outright would leave the dongle claimed until the page
        // unloads, so give it a moment before pulling the plug.
        if (worker) setTimeout(() => worker.terminate(), 250);
        rtlReaders.delete(id);
        const stats = window.__grUsbStats[id];
        if (stats && stats.state !== 'error') stats.state = 'cancelled';
      };

      // PlutoSDR Source and Sink use the stock firmware's USB IIOD service.
      // One worker owns each selected Pluto and discovers the IIO interface,
      // endpoint pairs, device ids and scan layout instead of baking in the
      // values from one firmware release. See docs/plutosdr.md.
      let nextPlutoWorkerId = 10000;
      const plutoWorkers = new Map();
      window.__grStartPlutoSdr = (
        direction, serial, memory, ringPointer, capacityFrames, channels,
        controlPointer, errorPointer, sampleRate, bufferSize
      ) => {
        const id = nextPlutoWorkerId++;
        const workerUrl = new URL('plutosdr_worker.js', location.href);
        if (window.__grBuildStamp) workerUrl.searchParams.set('v', window.__grBuildStamp);
        const worker = new Worker(workerUrl);
        const label = serial || 'first available';
        const stats = {
          device: 'PlutoSDR',
          direction,
          serial: label,
          channels,
          ringBytes: capacityFrames * channels * 4,
          requestedRate: sampleRate,
          actualRate: 0,
          bytesRead: 0,
          bytesWritten: 0,
          overruns: 0,
          underflows: 0,
          droppedSamples: 0,
          state: 'starting',
        };
        window.__grUsbStats[id] = stats;
        plutoWorkers.set(id, worker);
        const name = `PlutoSDR ${direction.toUpperCase()} ${label}`;
        worker.onmessage = event => {
          const message = event.data || {};
          if (Number.isFinite(message.requestedRate))
            stats.requestedRate = message.requestedRate;
          if (Number.isFinite(message.actualRate)) stats.actualRate = message.actualRate;
          if (Number.isFinite(message.bytes)) {
            if (direction === 'rx') stats.bytesRead = message.bytes;
            else stats.bytesWritten = message.bytes;
          }
          if (Number.isFinite(message.events)) {
            if (direction === 'rx') stats.overruns = message.events;
            else stats.underflows = message.events;
          }
          if (Number.isFinite(message.lost)) stats.droppedSamples = message.lost;
          if (USB_WORKER_STATES.has(message.type)) stats.state = message.type;
          if (message.type === 'running')
            console.log(
              `${name}: ${message.channels} channel(s) at ${message.actualRate} S/s`);
          if (message.type === 'error') reportUsbWorkerError(name, message);
          if (message.type === 'cancelled' || message.type === 'error')
            plutoWorkers.delete(id);
        };
        worker.onerror = event => {
          stats.state = 'error';
          console.error(`${name} worker: ${event.message || 'worker error'}`);
          plutoWorkers.delete(id);
        };
        worker.postMessage({
          direction,
          serial,
          memory,
          ringPointer,
          capacityFrames,
          channels,
          controlPointer,
          errorPointer,
          errorCapacity: 512,
          sampleRate,
          bufferSize,
        });
        return id;
      };
      window.__grStopPlutoSdr = id => {
        const worker = plutoWorkers.get(id);
        // The data endpoint has a three-second IIOD timeout. Let the worker
        // observe CANCELLED and close/release normally before forcing it down.
        if (worker) setTimeout(() => worker.terminate(), 3500);
        plutoWorkers.delete(id);
        const stats = window.__grUsbStats[id];
        if (stats && stats.state !== 'error') stats.state = 'cancelled';
      };

      // HackRF One is a half-duplex signed-8-bit IQ device. One worker owns a
      // selected unit for either RX or TX and talks its stock vendor-control
      // protocol directly over WebUSB. See docs/hackrf.md.
      let nextHackRfWorkerId = 20000;
      const hackRfWorkers = new Map();
      window.__grStartHackRf = (
        direction, serial, memory, ringPointer, capacityPairs,
        controlPointer, errorPointer, sampleRate, transferBytes
      ) => {
        const id = nextHackRfWorkerId++;
        const workerUrl = new URL('hackrf_worker.js', location.href);
        if (window.__grBuildStamp) workerUrl.searchParams.set('v', window.__grBuildStamp);
        const worker = new Worker(workerUrl);
        const label = serial || 'first available';
        const stats = {
          device: 'HackRF', direction, serial: label,
          ringBytes: capacityPairs * 2,
          requestedRate: sampleRate, actualRate: 0,
          bytesRead: 0, bytesWritten: 0,
          overruns: 0, underflows: 0, droppedSamples: 0,
          firmware: '', usbApi: '', state: 'starting',
        };
        window.__grUsbStats[id] = stats;
        hackRfWorkers.set(id, worker);
        const name = `HackRF ${direction.toUpperCase()} ${label}`;
        worker.onmessage = event => {
          const message = event.data || {};
          if (Number.isFinite(message.actualRate)) stats.actualRate = message.actualRate;
          if (Number.isFinite(message.bytes)) {
            if (direction === 'rx') stats.bytesRead = message.bytes;
            else stats.bytesWritten = message.bytes;
          }
          if (Number.isFinite(message.events)) {
            if (direction === 'rx') stats.overruns = message.events;
            else stats.underflows = message.events;
          }
          if (Number.isFinite(message.lost)) stats.droppedSamples = message.lost;
          if (message.type === 'device') {
            stats.firmware = message.firmware || '';
            stats.usbApi = message.usbApi || '';
            console.log(`${name}: firmware ${stats.firmware}, USB API ${stats.usbApi}`);
          }
          if (message.type === 'trace') {
            console.log(`${name}| ${message.text}`);
            return;
          }
          if (USB_WORKER_STATES.has(message.type)) stats.state = message.type;
          if (message.type === 'running')
            console.log(`${name}: running at ${message.actualRate} S/s`);
          if (message.type === 'error') reportUsbWorkerError(name, message);
          if (message.type === 'cancelled' || message.type === 'error')
            hackRfWorkers.delete(id);
        };
        worker.onerror = event => {
          stats.state = 'error';
          console.error(`${name} worker: ${event.message || 'worker error'}`);
          hackRfWorkers.delete(id);
        };
        worker.postMessage({
          direction, serial, memory, ringPointer, capacityPairs,
          controlPointer, errorPointer, errorCapacity: 512,
          sampleRate, transferBytes,
        });
        return id;
      };
      window.__grStopHackRf = id => {
        const worker = hackRfWorkers.get(id);
        // Ask the worker to switch the transceiver OFF immediately. The shared
        // CANCELLED state remains the authoritative signal to its stream loop.
        if (worker) {
          worker.postMessage({ type: 'stop' });
          setTimeout(() => worker.terminate(), 1000);
        }
        hackRfWorkers.delete(id);
        const stats = window.__grUsbStats[id];
        if (stats && stats.state !== 'error') stats.state = 'cancelled';
      };

      // Audio Sink and Audio Source: the browser's sound card, in place of
      // gr-audio's ALSA/PortAudio devices. Both blocks proxy their start() here
      // for the same reason the USB radios do -- an AudioContext,
      // audioWorklet.addModule() and getUserMedia() are all main-thread work --
      // and then talk to runner/src/audio_worklet.js through a ring in shared
      // WASM memory and nothing else. See docs/audio.md.
      const CONTROL_STATE = 2;      // struct Control's slots, from browser_audio.hpp
      const CONTROL_ERROR_LENGTH = 3;
      const AUDIO_ERROR = 2;
      let nextAudioId = 30000;
      const audioBlocks = new Map();
      window.__grAudioStats = Object.create(null);

      // One AudioContext per (rate, output device) rather than per block: a
      // flowgraph that both captures and plays is then running on ONE audio
      // clock, so its source and sink cannot drift apart over a long run. It
      // also keeps well clear of the browser's limit on hardware contexts.
      const audioContexts = new Map();

      function acquireAudioContext(flowRate, sinkId) {
        const key = `${flowRate}|${sinkId}`;
        let entry = audioContexts.get(key);
        if (!entry) {
          let context;
          try {
            // Asking for the flowgraph's own rate is what normally makes the
            // worklet's resampling path unnecessary; the browser resamples to
            // whatever the hardware runs at, far better than we would.
            context = new AudioContext({ sampleRate: flowRate, latencyHint: 'interactive' });
          } catch (error) {
            context = new AudioContext();
          }
          entry = {
            key,
            context,
            users: 0,
            // addModule() once per context, shared by every block on it.
            module: null,
            sinkId,
          };
          audioContexts.set(key, entry);
        }
        entry.users++;
        return entry;
      }

      function releaseAudioContext(entry) {
        if (!entry || --entry.users > 0) return;
        audioContexts.delete(entry.key);
        suspendedContexts.delete(entry.context);
        entry.context.close().catch(() => {});
      }

      function audioWorkletModule(entry) {
        if (!entry.module) {
          const url = new URL('audio_worklet.js', location.href);
          if (window.__grBuildStamp) url.searchParams.set('v', window.__grBuildStamp);
          entry.module = entry.context.audioWorklet.addModule(url);
        }
        return entry.module;
      }

      // The autoplay policy. An AudioContext may only start once the page has
      // been interacted with, and this frame's flowgraph starts from a click in
      // the *editor* -- so the context can perfectly well come up suspended.
      // resume() then returns a promise that simply never settles, which is why
      // nothing here awaits it: the page listens for a gesture instead, in this
      // frame and (relayed by the editor) in the one around it.
      const suspendedContexts = new Set();
      let announcedAudioBlocked = false;

      const resumeSuspendedAudio = () => {
        for (const context of suspendedContexts) context.resume().catch(() => {});
      };
      for (const type of ['pointerdown', 'keydown', 'touchend'])
        window.addEventListener(type, resumeSuspendedAudio, true);
      // The editor relays a gesture of its own, because the reader is far more
      // likely to click there -- on the Run button, on the canvas -- than on
      // the flowgraph window this frame draws.
      window.addEventListener('message', event => {
        if (event.source === window.parent && event.data &&
            event.data.type === 'gr-audio-resume') resumeSuspendedAudio();
      });

      function requestAudioResume(context) {
        if (context.state === 'running') return;
        suspendedContexts.add(context);
        context.addEventListener('statechange', () => {
          if (context.state !== 'running') return;
          suspendedContexts.delete(context);
          if (!suspendedContexts.size && announcedAudioBlocked) {
            announcedAudioBlocked = false;
            postToEditor({ type: 'gr-audio-running' });
          }
        });
        context.resume().catch(() => {});
        // state does not move synchronously, so give the resume a moment before
        // deciding it was refused.
        setTimeout(() => {
          if (context.state === 'running' || announcedAudioBlocked) return;
          announcedAudioBlocked = true;
          console.warn('Audio is waiting for a click: the browser blocks sound until the page is interacted with.');
          postToEditor({ type: 'gr-audio-blocked' });
        }, 500);
      }

      function postToEditor(message) {
        if (window.parent && window.parent !== window)
          window.parent.postMessage(message, '*');
      }

      function failAudio(id, memory, controlPointer, errorPointer, error) {
        const message = String(error && error.message ? error.message : error);
        const stats = window.__grAudioStats[id];
        if (stats) { stats.state = 'error'; stats.error = message; }
        const encoded = new TextEncoder().encode(message);
        const length = Math.min(encoded.byteLength, 511);
        new Uint8Array(memory.buffer, errorPointer, 512).fill(0);
        new Uint8Array(memory.buffer, errorPointer, length)
          .set(encoded.subarray(0, length));
        const control = new Int32Array(memory.buffer, controlPointer, 8);
        Atomics.store(control, CONTROL_ERROR_LENGTH, length);
        Atomics.store(control, CONTROL_STATE, AUDIO_ERROR);
        // Both, because the waiting block is on one of them and which one
        // depends on its direction.
        Atomics.notify(control, 0);
        Atomics.notify(control, 1);
        console.error(`${stats ? stats.label : 'Audio'}: ${message}`);
      }

      // gr-audio's Device Name, which upstream is an ALSA name. Here it names a
      // browser media device, matched on its id or (case-insensitively) on any
      // part of its label. Labels are only readable once the origin has been
      // granted microphone permission, which is why the failure says so.
      async function resolveAudioDevice(kind, name) {
        if (!name) return '';
        const devices = await navigator.mediaDevices.enumerateDevices();
        const candidates = devices.filter(device => device.kind === kind);
        const wanted = name.toLowerCase();
        const match = candidates.find(device => device.deviceId === name) ||
          candidates.find(device => (device.label || '').toLowerCase().includes(wanted));
        if (match) return match.deviceId;
        const labels = candidates.map(device => device.label).filter(Boolean);
        throw new Error(labels.length
          ? `no audio device matches "${name}" (available: ${labels.join(', ')})`
          : `no audio device matches "${name}"; device names are only visible ` +
            'once the page has been granted microphone permission');
      }

      async function startAudioBlock(id, block, options) {
        const {
          direction, device, memory, ringPointer, capacityFrames, channels,
          controlPointer, flowRate,
        } = options;
        const stats = window.__grAudioStats[id];
        const isInput = direction === 'input';

        const sinkId = isInput ? '' : await resolveAudioDevice('audiooutput', device);
        const entry = acquireAudioContext(flowRate, sinkId);
        block.contextEntry = entry;
        const context = entry.context;
        if (sinkId && context.sinkId !== sinkId) {
          if (typeof context.setSinkId !== 'function')
            throw new Error('this browser cannot choose an audio output device; leave Device Name blank');
          await context.setSinkId(sinkId);
        }
        await audioWorkletModule(entry);
        stats.actualRate = context.sampleRate;

        let stream = null;
        if (isInput) {
          const deviceId = await resolveAudioDevice('audioinput', device);
          // Every processing default off: this is a signal path, not a voice
          // call, and echo cancellation would gate and filter the samples the
          // flowgraph is meant to see.
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              ...(deviceId ? { deviceId: { exact: deviceId } } : {}),
              channelCount: channels,
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
            },
          });
          block.stream = stream;
          if (block.stopped) throw new Error('stopped');
        }

        const node = new AudioWorkletNode(
          context, isInput ? 'gr-audio-source' : 'gr-audio-sink', {
            numberOfInputs: isInput ? 1 : 0,
            numberOfOutputs: 1,
            outputChannelCount: [isInput ? 1 : channels],
            processorOptions: {
              memory, ringPointer, controlPointer, capacityFrames, channels, flowRate,
            },
          });
        block.node = node;
        if (block.stopped) { node.disconnect(); return; }
        if (isInput) {
          context.createMediaStreamSource(stream).connect(node);
          // A capture node produces nothing, but only a node the destination
          // can reach is guaranteed to be pulled at all -- so it keeps one
          // silent output and connects it.
          node.connect(context.destination);
          stats.deviceLabel = stream.getAudioTracks()[0]?.label || '';
        } else {
          node.connect(context.destination);
        }
        stats.state = 'running';
        requestAudioResume(context);
      }

      window.__grStartAudio = (
        direction, device, memory, ringPointer, capacityFrames, channels,
        controlPointer, errorPointer, flowRate
      ) => {
        const id = nextAudioId++;
        const label = direction === 'input' ? 'Audio Source' : 'Audio Sink';
        const stats = {
          label,
          direction,
          device: device || 'default',
          requestedRate: flowRate,
          actualRate: 0,
          channels,
          ringFrames: capacityFrames,
          state: 'starting',
        };
        window.__grAudioStats[id] = stats;
        const block = { stopped: false, node: null, stream: null, contextEntry: null };
        audioBlocks.set(id, block);
        // The block's start() cannot await any of this, so the whole opening
        // sequence runs on afterwards and reports through the control block:
        // the ring simply stays empty until the device is there.
        startAudioBlock(id, block, {
          direction, device, memory, ringPointer, capacityFrames, channels,
          controlPointer, flowRate,
        }).catch(error => {
          if (block.stopped) return;    // a stop() that raced the open is not a failure
          failAudio(id, memory, controlPointer, errorPointer, error);
          window.__grStopAudio(id);
        });
        return id;
      };

      window.__grStopAudio = id => {
        const block = audioBlocks.get(id);
        if (!block) return;
        audioBlocks.delete(id);
        block.stopped = true;
        if (block.node) {
          // The CANCELLED state the block set before calling here is what ends
          // the processor; this only saves it a render quantum of waiting.
          try { block.node.port.postMessage({ type: 'stop' }); } catch (error) { /* closed */ }
          block.node.disconnect();
        }
        if (block.stream) for (const track of block.stream.getTracks()) track.stop();
        releaseAudioContext(block.contextEntry);
        const stats = window.__grAudioStats[id];
        if (stats && stats.state !== 'error') stats.state = 'cancelled';
      };

      window.__grStopBrowserFileSource = id => {
        const worker = fileReaders.get(id);
        if (worker) worker.terminate();
        fileReaders.delete(id);
        const stats = window.__grFileStats[id];
        if (stats && stats.state !== 'eof' && stats.state !== 'error')
          stats.state = 'cancelled';
      };

      // BrowserFileSink's half of the same arrangement: start() proxies here
      // from a scheduler pthread only to create the writer worker, and the block
      // and worker then talk exclusively through atomics in the shared ring.
      // Emscripten's filesystem is in-memory, so this worker is the only way a
      // recording reaches the reader's disk.
      let nextFileWriterId = 1;
      const fileWriters = new Map();
      window.__grSinkStats = Object.create(null);

      // A recording buffered in memory (no File System Access API) comes back as
      // two blobs to hand to the browser's downloader. Same-origin and
      // un-sandboxed, so a programmatic click is allowed here.
      const downloadBlob = (blob, filename) => {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.rel = 'noopener';
        document.body.appendChild(link);
        link.click();
        link.remove();
        // Long enough for the download to have been handed off; revoking
        // immediately cancels it in some builds.
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      };

      window.__grStartBrowserFileSink = (
        path, memory, ringPointer, capacityItems, itemSize, controlPointer, errorPointer
      ) => {
        const sink = window.__grOutputSinks && window.__grOutputSinks[path];
        if (!sink) throw new Error(`no output is bound in this session: ${path}`);
        const id = nextFileWriterId++;
        const workerUrl = new URL('browser_file_writer.js', location.href);
        if (window.__grBuildStamp) workerUrl.searchParams.set('v', window.__grBuildStamp);
        const worker = new Worker(workerUrl);
        const stats = {
          path, base: sink.base, mode: sink.kind, bytesWritten: 0, state: 'starting',
        };
        window.__grSinkStats[id] = stats;
        fileWriters.set(id, worker);
        worker.onmessage = event => {
          const message = event.data || {};
          if (Number.isFinite(message.bytesWritten)) stats.bytesWritten = message.bytesWritten;
          if (message.type) stats.state = message.type;
          if (message.type === 'error')
            console.error(`SigMF Sink ${path}: ${message.message}`);
          if (message.type === 'done' && message.mode === 'download') {
            downloadBlob(message.data, `${message.base}.sigmf-data`);
            downloadBlob(
              new Blob([message.meta || ''], { type: 'application/json' }),
              `${message.base}.sigmf-meta`);
          }
          if (message.type === 'done' || message.type === 'cancelled' ||
              message.type === 'error')
            fileWriters.delete(id);
        };
        worker.onerror = event => {
          stats.state = 'error';
          console.error(`SigMF Sink worker ${path}: ${event.message || 'worker error'}`);
          fileWriters.delete(id);
        };
        worker.postMessage({
          sink, memory, ringPointer, capacityItems, itemSize,
          controlPointer, errorPointer, errorCapacity: 512,
        });
        stats.state = 'running';
        return id;
      };

      // The trailing .sigmf-meta, which cannot exist until the flowgraph stops
      // and the samples are counted. Posted separately from the FINISHING state
      // the block sets; the worker waits for both before closing the file.
      window.__grFinishBrowserFileSink = (id, payload) => {
        const worker = fileWriters.get(id);
        if (worker) worker.postMessage({ type: 'finish', payload });
      };

      window.__grStopBrowserFileSink = id => {
        const worker = fileWriters.get(id);
        if (!worker) return;   // already finished and cleaned itself up
        // Deferred by one turn, unlike the reader's. On the normal path the
        // worker has already closed itself and posted its result -- which for a
        // buffered recording *carries the blobs* -- and that message is still
        // sitting in this frame's task queue when the block's stop() gets here.
        // Terminating now would be racing it.
        setTimeout(() => {
          if (fileWriters.get(id) !== worker) return;   // the message landed
          worker.terminate();
          fileWriters.delete(id);
          const stats = window.__grSinkStats[id];
          if (stats && stats.state !== 'done' && stats.state !== 'error')
            stats.state = 'cancelled';
        }, 0);
      };

      // Repo JavaScript Blocks: the source fetch.
      //
      // A JS block's factory reads its descriptor synchronously, so it needs the
      // source *text* in hand when it runs -- and construction cannot await. One
      // step joins the load chain before any block is built: runner.cpp scans the
      // lowered flowgraph for repo JS block ids and asks for their files here.
      //
      // A handful of kilobytes of text, the same shape as the deferred
      // side-module fetch above it -- not a runtime. An instance carrying its own
      // inline source is never in this list: use the inline source when a block
      // instance carries one, otherwise fetch by id.
      window.__grLoadJsBlockSources = requestJson => {
        const bridge = window.__grJsBridge;
        let wanted;
        try {
          wanted = JSON.parse(requestJson);
        } catch (error) {
          bridge.finish(false, 'malformed JS block request: ' + error.message);
          return;
        }
        Promise.all(wanted.map(entry => {
          const url = new URL('js/' + entry.file, location.href);
          if (window.__grBuildStamp) url.searchParams.set('v', window.__grBuildStamp);
          return fetch(url).then(response => {
            if (!response.ok)
              throw new Error(`${entry.id}: js/${entry.file} — HTTP ${response.status}`);
            return response.text();
          }).then(text => [entry.id, text]);
        })).then(pairs => {
          bridge.finish(true, JSON.stringify(Object.fromEntries(pairs)));
        }).catch(error => {
          bridge.finish(false, 'JS Block source: ' + (error && error.message ? error.message : error));
        });
      };

      // Embedded Python Block: the Pyodide worker and the prepare step.
      //
      // The C++ side cannot wait for Python at construction time (see
      // blocks/src/python_block.hpp), so gr_run_json pauses the whole flowgraph
      // here instead: __grPyodidePrepare starts the worker, has it instantiate
      // every Python Block, and calls back into _gr_finish_pyodide_prepare with
      // the answer. Each block's constructor then reads its own description
      // synchronously through __grPyodideDescription and posts its control block
      // through __grPyodideBindBlock.
      //
      // One worker for the whole flowgraph: Python Blocks then serialize against
      // each other, exactly as the GIL makes them serialize in desktop GNU Radio.
      // Widths of the control block in blocks/src/python_block.hpp, passed on to
      // the worker so a mismatch is an error message rather than a wild write.
      const PYTHON_MAX_PORTS = 32;
      const PYTHON_CONTROL_WORDS = 10 + 5 * PYTHON_MAX_PORTS;
      const PYTHON_DOUBLE_SLOTS = 2 * PYTHON_MAX_PORTS + 32;

      let pyodideWorker = null;
      const pyodideDescriptions = Object.create(null);
      window.__grPyodideDescription = name => pyodideDescriptions[name] || null;

      window.__grPyodidePrepare = requestJson => {
        // __grPyodideBridge is installed by prepare_python_then_run in
        // runner.cpp: this page cannot reach the module's exports or its memory
        // on its own.
        const bridge = window.__grPyodideBridge;
        let request;
        try {
          request = JSON.parse(requestJson);
        } catch (error) {
          bridge.finish(false, 'malformed prepare request: ' + error.message);
          return;
        }
        queueStdout('Python Block: starting the Python runtime (about 16 MB, once per visit)');
        const workerUrl = new URL('pyodide/gr_pyodide_worker.js', location.href);
        if (window.__grBuildStamp) workerUrl.searchParams.set('v', window.__grBuildStamp);
        const worker = new Worker(workerUrl, { type: 'module' });
        pyodideWorker = worker;
        let settled = false;
        const fail = message => {
          if (settled) return;
          settled = true;
          bridge.finish(false, message);
        };
        worker.onerror = event => fail(event.message || 'Python worker failed to start');
        worker.onmessage = event => {
          const message = event.data || {};
          if (message.type === 'print') { console.log(message.line); queueStdout(message.line); return; }
          if (message.type === 'ready') {
            worker.postMessage({
              type: 'prepare',
              blocks: request.blocks,
              scope: request.scope,
              controlWords: PYTHON_CONTROL_WORDS,
              doubleSlots: PYTHON_DOUBLE_SLOTS,
            });
            return;
          }
          if (message.type === 'prepared') {
            Object.assign(pyodideDescriptions, message.descriptions);
            if (settled) return;
            settled = true;
            bridge.finish(true, '');
            return;
          }
          if (message.type === 'failed') { fail(message.message); return; }
        };
        worker.postMessage({
          type: 'init',
          indexURL: new URL('/pyodide/', location.href).href,
          shimURL: new URL('pyodide/py/', location.href).href,
        });
      };

      window.__grPyodideBindBlock = (
        name, controlPointer, doublePointer, textPointer, textCapacity,
        controlWords, doubleSlots
      ) => {
        if (!pyodideWorker) return false;
        if (controlWords !== PYTHON_CONTROL_WORDS || doubleSlots !== PYTHON_DOUBLE_SLOTS) {
          console.error(`Python Block ${name}: control block is ${controlWords}/${doubleSlots} ` +
            `words, runner.html expects ${PYTHON_CONTROL_WORDS}/${PYTHON_DOUBLE_SLOTS}`);
          return false;
        }
        pyodideWorker.postMessage({
          type: 'bind',
          name,
          memory: window.__grPyodideBridge.memory,
          controlPointer,
          doublePointer,
          textPointer,
          textCapacity,
        });
        return true;
      };

      // gr-paint's Image File Source, decoded by the browser.
      //
      // Upstream is a Python block that opens a local file with PIL. There is
      // no PIL and no filesystem here, so the block names its image either with
      // a URL or with the /local-files/... path the editor binds a
      // browser-picked File to, and this decodes it with the platform's own
      // image support, applying the same pipeline the Python does: grayscale,
      // optional autocontrast, optional inversion, optional flip, downscale to
      // the Spectrum Painter's 4096px limit, and the ITU-R BT.709 level
      // mapping.
      //
      // ImageSourceWasm (blocks/overlays/gr-paint/paint_image_source.cpp) drives
      // this in two steps, because a decode is asynchronous and a GNU Radio
      // constructor is not:
      // __grLoadImageSource starts the job and returns an id immediately,
      // and __grTakeImageSource copies the finished pixels into WASM memory
      // once the block's own scheduler thread has waited for the state word.
      const IMAGE_SOURCE_STATE = { loading: 0, ready: 1, failed: 2 };
      const imageSourceJobs = new Map();
      let nextImageSourceId = 1;

      // The bytes behind the block's Image File parameter. A local image picked
      // with Properties > Browse arrives as the same session-only File binding
      // File Source uses, so it is read straight out of the page and never
      // touches the network; anything else is a URL to fetch.
      const imageSourceBlob = async name => {
        const bound = window.__grInputSources && window.__grInputSources[name];
        if (bound) {
          if (bound.kind !== 'local' || !bound.file)
            throw new Error(`${name} is not bound to a local image in this session`);
          return bound.file;
        }
        // Cross-origin isolation means an image from another origin has to be
        // served with permissive CORS headers; without them the fetch fails
        // here rather than tainting a canvas later, which is the clearer
        // failure of the two.
        const response = await fetch(name, { mode: 'cors', credentials: 'omit' });
        if (!response.ok)
          throw new Error(`HTTP ${response.status} ${response.statusText} for ${name}`);
        return await response.blob();
      };

      // PNG, JPEG, GIF, WebP and BMP all decode through createImageBitmap.
      // SVG does not — Chrome refuses an SVG blob there — and an <img> element
      // is the one decoder in a page that rasterizes one, so that is the
      // fallback. It rasterizes at the SVG's intrinsic size (the browser's
      // 300x150 default when the file declares neither width nor height), so
      // an SVG paints at whatever resolution it was authored for rather than
      // at some size chosen here. The blob is same-origin either way — a
      // remote image was already fetched with CORS above — so the canvas it is
      // drawn on stays readable by getImageData.
      const decodeImageSourceBlob = async (blob, name) => {
        try {
          const bitmap = await createImageBitmap(blob);
          if (bitmap.width && bitmap.height)
            return {
              image: bitmap,
              width: bitmap.width,
              height: bitmap.height,
              release: () => bitmap.close(),
            };
          bitmap.close();
        } catch (error) {
          // Not a format createImageBitmap handles; try the <img> path below.
        }
        const objectUrl = URL.createObjectURL(blob);
        const image = new Image();
        try {
          await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = () =>
              reject(new Error(`the browser could not decode ${name} as an image`));
            image.src = objectUrl;
          });
        } catch (error) {
          URL.revokeObjectURL(objectUrl);
          throw error;
        }
        return {
          image,
          width: image.naturalWidth || image.width,
          height: image.naturalHeight || image.height,
          release: () => URL.revokeObjectURL(objectUrl),
        };
      };

      window.__grLoadImageSource = (
        url, memory, controlPointer, errorPointer, errorCapacity,
        maxWidth, maxPixels, flip, bt709Map, invert, autocontrast
      ) => {
        const id = nextImageSourceId++;
        const job = { pixels: null, released: false };
        imageSourceJobs.set(id, job);

        const control = new Int32Array(memory.buffer, controlPointer, 4);
        const finish = (state, width, height) => {
          if (job.released) return;
          Atomics.store(control, 1, width | 0);
          Atomics.store(control, 2, height | 0);
          Atomics.store(control, 0, state);
          Atomics.notify(control, 0);
        };
        const fail = error => {
          if (job.released) return;
          const text = String((error && error.message) || error || 'image load failed');
          const bytes = new TextEncoder().encode(text).subarray(0, errorCapacity - 1);
          new Uint8Array(memory.buffer, errorPointer, errorCapacity).set(bytes);
          Atomics.store(control, 3, bytes.length);
          finish(IMAGE_SOURCE_STATE.failed, 0, 0);
        };

        (async () => {
          const decoded = await decodeImageSourceBlob(await imageSourceBlob(url), url);

          let width = decoded.width;
          let height = decoded.height;
          if (!width || !height) {
            decoded.release();
            throw new Error('the image has no pixels');
          }
          if (width > maxWidth) {
            const scale = maxWidth / width;
            width = Math.floor(width * scale);
            height = Math.max(1, Math.floor(height * scale));
          }
          if (width * height > maxPixels) {
            decoded.release();
            throw new Error(
              `image is too large: ${width}x${height} px exceeds the ` +
              `${maxPixels} px limit`);
          }

          const canvas = new OffscreenCanvas(width, height);
          const context = canvas.getContext('2d', { willReadFrequently: true });
          context.imageSmoothingQuality = 'high';
          // For waterfalls that scroll from the top. Flipping while drawing
          // costs nothing, where PIL needs a second pass over the pixels.
          if (flip) { context.translate(0, height); context.scale(1, -1); }
          context.drawImage(decoded.image, 0, 0, width, height);
          decoded.release();

          const rgba = context.getImageData(0, 0, width, height).data;
          const luma = new Uint8Array(width * height);
          // PIL's ImageOps.grayscale is convert("L"), i.e. the ITU-R 601-2
          // luma coefficients. Alpha is ignored, as it is there; a transparent
          // PNG therefore comes out over black.
          for (let i = 0, p = 0; i < luma.length; i++, p += 4)
            luma[i] = (rgba[p] * 299 + rgba[p + 1] * 587 + rgba[p + 2] * 114) / 1000;

          if (autocontrast) {
            // ImageOps.autocontrast with the default cutoff: stretch the
            // extremes to the full range through a truncating LUT.
            let low = 255, high = 0;
            for (let i = 0; i < luma.length; i++) {
              if (luma[i] < low) low = luma[i];
              if (luma[i] > high) high = luma[i];
            }
            if (high > low) {
              const scale = 255 / (high - low);
              for (let i = 0; i < luma.length; i++)
                luma[i] = Math.min(255, Math.max(0, Math.trunc((luma[i] - low) * scale)));
            }
          }
          if (invert)
            for (let i = 0; i < luma.length; i++) luma[i] = 255 - luma[i];
          if (bt709Map)
            // Scale brightness into the BT.709 studio range, 16..235.
            for (let i = 0; i < luma.length; i++)
              luma[i] = Math.floor(luma[i] * 219 / 255) + 16;

          job.pixels = luma;
          finish(IMAGE_SOURCE_STATE.ready, width, height);
        })().catch(fail);

        return id;
      };

      window.__grTakeImageSource = (id, memory, destinationPointer, byteLength) => {
        const job = imageSourceJobs.get(id);
        if (!job || !job.pixels || job.pixels.length !== byteLength) return 0;
        new Uint8Array(memory.buffer, destinationPointer, byteLength).set(job.pixels);
        imageSourceJobs.delete(id);
        return 1;
      };

      window.__grReleaseImageSource = id => {
        const job = imageSourceJobs.get(id);
        if (job) job.released = true;   // a decode still in flight writes nothing
        imageSourceJobs.delete(id);
      };

      // Mirror the flowgraph's stdout into the editor's console pane.
      //
      // Blocks that report to the user do it by printing: Message Debug dumps
      // each PDU, Print Header / Print Timestamp annotate frames. Emscripten
      // sends that to console.log, which means devtools — so from the editor a
      // decoding flowgraph looks like it produced nothing. Forward it to the
      // parent frame, which appends it to the log under the canvas.
      //
      // Batched and capped on purpose: a Message Debug on a fast frame source
      // emits several hundred lines a second, and one postMessage per line
      // would swamp both this frame and the editor's DOM.
      const STDOUT_FLUSH_MS = 100;      // coalesce bursts into ~10 posts/second
      const STDOUT_MAX_BATCH = 200;     // lines kept per flush; the rest counted
      let stdoutQueue = [], stdoutDropped = 0, stdoutTimer = 0;

      function flushStdout() {
        stdoutTimer = 0;
        if (!stdoutQueue.length && !stdoutDropped) return;
        const lines = stdoutQueue;
        const dropped = stdoutDropped;
        stdoutQueue = [];
        stdoutDropped = 0;
        window.parent.postMessage({ type: 'gr-print', lines, dropped }, '*');
      }

      function queueStdout(text) {
        if (!(window.parent && window.parent !== window)) return;
        if (stdoutQueue.length >= STDOUT_MAX_BATCH) stdoutDropped++;
        else stdoutQueue.push(String(text));
        if (!stdoutTimer) stdoutTimer = setTimeout(flushStdout, STDOUT_FLUSH_MS);
      }

      // The editor's Arrange overlay drags a live widget around and sends the
      // new grid down here, where it is applied to the running flowgraph in
      // place: the plots keep plotting, nothing is rebuilt, and the flowgraph
      // never restarts. The editor owns the packing rules (one implementation,
      // in editor/src/gui-layout.ts) and this end only renders what it is sent.
      // Stop, gracefully. The editor unloads this frame to stop a flowgraph,
      // which is fine for everything that only reads -- and wrong for a SigMF
      // Sink, whose writer worker dies with the tail of the recording still in
      // shared memory. A flowgraph that writes one asks here first and waits for
      // the acknowledgement below before unloading.
      window.addEventListener('message', event => {
        const data = event.data;
        if (!data || data.type !== 'gr-shutdown') return;
        if (event.source !== window.parent) return;
        const ack = () => window.parent.postMessage(
          { type: 'gr-shutdown-done' }, location.origin);
        const instance = window.__grRunnerInstance;
        if (!instance || typeof instance._gr_shutdown_flowgraph !== 'function') {
          ack();     // never started, or an older build: nothing to bring down
          return;
        }
        try {
          // Signals and returns. It must not join -- see the comment on
          // gr_shutdown_flowgraph() in runner.cpp: this thread has to stay free
          // to service the proxied calls each block's stop() makes on its way
          // down, and blocking here deadlocks against exactly those.
          instance._gr_shutdown_flowgraph();
        } catch (error) {
          console.error('flowgraph shutdown failed:', error);
          ack();
          return;
        }
        // What the editor is actually waiting for is the recordings being
        // finished, not the scheduler threads joining -- that is the only part
        // of a shutdown unloading this frame would lose. A flowgraph with no
        // writer at all acknowledges on the first poll.
        const deadline = performance.now() + 20000;
        const stillWriting = () => Object.values(window.__grSinkStats || {}).some(
          stats => stats.state !== 'done' && stats.state !== 'error' &&
                   stats.state !== 'cancelled');
        const poll = () => {
          if (!stillWriting()) { ack(); return; }
          if (performance.now() > deadline) {
            console.error('SigMF Sink: gave up waiting for the recording to finish');
            ack();
            return;
          }
          setTimeout(poll, 50);
        };
        poll();
      });

      window.addEventListener('message', event => {
        const data = event.data;
        if (!data || data.type !== 'gr-set-layout') return;
        // Only the frame that embedded this one has any business rearranging it.
        if (event.source !== window.parent) return;
        const instance = window.__grRunnerInstance;
        if (!instance) return;   // still loading; the run picks the spec up itself
        // Qt's qtLoad() resolves to the Emscripten module, but not with ccall or
        // malloc on it -- only the string helpers and the raw exports. The spec
        // is a few hundred bytes, so the stack is the right place for it and
        // needs no allocator.
        const stack = instance.stackSave();
        try {
          instance._gr_apply_gui_layout(
            instance.stringToUTF8OnStack(String(data.tiles || '{}')),
            Number(data.columns) || 12, Number(data.rowHeight) || 60);
        } finally {
          instance.stackRestore(stack);
        }
      });

      async function init()
      {
        const spinner = document.querySelector('#qtspinner');
        const screen = document.querySelector('#screen');
        const status = document.querySelector('#qtstatus');

        const showUi = (ui) => {
          const loaded = screen === ui;
          // `screen` must remain laid out while Qt starts; visibility hides its
          // contents without changing the QScreen dimensions Qt observes.
          screen.style.display = 'block';
          screen.style.visibility = loaded ? 'visible' : 'hidden';
          spinner.style.display = loaded ? 'none' : 'flex';
        }

        try {
          showUi(spinner);
          status.textContent = 'Loading…';
          const bindings = bindingsForRun();
          if (flowgraphUsesFosphorSink()) {
            status.textContent = 'Initializing WebGPU…';
            await window.__grFosphorWebGpu.prepare();
          }
          status.textContent = 'Loading…';
          window.__grInputSources = Object.create(null);
          for (const source of bindings.inputs)
            window.__grInputSources[source.path] = source;
          window.__grMountedRecordings = bindings.inputs.map(source => source.path);
          window.__grOutputSinks = Object.create(null);
          for (const sink of bindings.outputs)
            window.__grOutputSinks[sink.path] = sink;

          const instance = await qtLoad({
            // runner.js and runner.wasm are one indivisible build: emcc bakes
            // the EM_ASM string addresses of THIS link into runner.js's
            // ASM_CONSTS table, and those addresses move on every link. A
            // runner.js kept from an earlier deploy next to a freshly fetched
            // runner.wasm therefore dies on main()'s first EM_ASM with
            // "ASM_CONSTS[code] is not a function" — which is what a browser
            // does when it reuses the 1.2 MB script from its in-memory cache but
            // goes back to the network for the 19.5 MB wasm. Neither file has a
            // version in its name, so scripts/assemble-site.mjs stamps a
            // per-build id into this page (always fetched fresh: the editor
            // gives it a unique recordingToken) and onto the <script> srcs
            // below; carry it onto the files the runtime fetches by itself —
            // runner.wasm and the dlopen'd category side modules — so one
            // build's artifacts can only ever load as a set. Unstamped (dev
            // server, smoke tests, where the tree is always self-consistent)
            // __grBuildStamp is undefined and this hook stays inert.
            locateFile: window.__grBuildStamp
              ? (path, prefix) => `${prefix ?? ''}${path}?v=${window.__grBuildStamp}`
              : undefined,
            // Emscripten's stdout hook. Keep the console.log so devtools and the
            // headless tests still see it, and mirror it to the editor.
            print: (text) => { console.log(text); queueStdout(text); },
            qt: {
              onLoaded: () => showUi(screen),
              onExit: exitData =>
              {
                status.textContent = 'Application exit';
                status.textContent +=
                  exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                status.textContent +=
                  exitData.text !== undefined ? ` (${exitData.text})` : '';
                showUi(spinner);
              },
              entryFunction: window.runner_entry,
              containerElements: [screen],
            }
          });
          window.__grRunnerInstance = instance;
        } catch (error) {
          console.error(error);
          console.error(error.stack);
          status.textContent = `Runner failed: ${error.message || error}`;
          showUi(spinner);
        }
      }
    </script>
    <script src="fosphor_webgpu.js"></script>
    <script src="runner.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
