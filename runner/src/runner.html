<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>runner</title>
    <style>
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #screen { width: 100%; height: 100%; }
    </style>
  </head>
  <body onload="init()">
    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img src="qtlogo.svg" width="320" height="200" style="display:block"></img>
        <strong>Qt for WebAssembly: runner</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <script type="text/javascript">
      // Emscripten evaluates PTHREAD_POOL_SIZE when runner_entry() starts, so
      // select the prewarmed tier now, before runner.js is instantiated by Qt.
      // One worker is reserved for the detached top-block run thread; GNU Radio
      // then normally creates one scheduler worker per stream block. Counting
      // every top-level GRC block is intentionally conservative because some are
      // variables rather than scheduler blocks. Hierarchies can expand the other
      // way, in which case PTHREAD_POOL_SIZE_STRICT=0 permits extra workers.
      // Round up to a multiple of 8 rather than to a coarse power of two. Each
      // prewarmed worker costs ~50-100 ms (it loads the module, and with
      // MAIN_MODULE any side modules too), so the old 32 -> 256 step meant a
      // 33-worker flowgraph spent ~28 s spawning workers before its first
      // sample. The 8 of slack is deliberate: it absorbs a miscount here — the
      // top-level block count over-counts variables and under-counts hierarchy
      // expansion — so a late thread request finds an unused worker instead of
      // proxying a Worker allocation to the main thread. Keep worker_tier_for()
      // in runner.cpp rounding identically, or its pre-start top-up re-inflates
      // the pool to whatever ladder it uses and this buys nothing.
      function poolTierForBlockCount(blockCount) {
        const requiredWorkers = Math.max(0, Number(blockCount) || 0) + 1;
        return Math.min(256, Math.max(8, Math.ceil(requiredWorkers / 8) * 8));
      }

      function flowgraphBlockCount() {
        if (!location.hash || location.hash.length <= 1) return 0;
        try {
          const grc = decodeURIComponent(location.hash.substring(1));
          const start = grc.search(/^blocks:\s*$/m);
          if (start < 0) return 0;
          const afterStart = grc.substring(start).replace(/^blocks:\s*\n?/, '');
          const end = afterStart.search(/^(?:connections|metadata):\s*$/m);
          const blockSection = end < 0 ? afterStart : afterStart.substring(0, end);
          return (blockSection.match(/^-\s+name\s*:/gm) || []).length;
        } catch (error) {
          console.warn('Could not size pthread tier from flowgraph:', error);
          return 0;
        }
      }

      function flowgraphUsesFosphorSink() {
        if (!location.hash || location.hash.length <= 1) return false;
        try {
          const grc = decodeURIComponent(location.hash.substring(1));
          return /^\s*id:\s*fosphor_qt_sink_c\s*$/m.test(grc);
        } catch (error) {
          return false;
        }
      }

      window.__grPoolTierForBlockCount = poolTierForBlockCount;
      window.__grFlowgraphBlockCount = flowgraphBlockCount();
      window.__grPoolTier = poolTierForBlockCount(window.__grFlowgraphBlockCount);

      function inputSourcesForRun() {
        const token = new URLSearchParams(location.search).get('recordingToken');
        if (!token) return [];
        if (window.parent === window ||
            typeof window.parent.__grTakeRecordingFiles !== 'function')
          throw new Error('browser file bindings are unavailable');

        const descriptors = window.parent.__grTakeRecordingFiles(token);
        return descriptors.map(descriptor => {
          if (typeof descriptor.path !== 'string' ||
              (!descriptor.path.startsWith('/recordings/') &&
               !descriptor.path.startsWith('/local-files/')))
            throw new Error('invalid browser file path');
          // Accept the old {blob} shape during local development so an editor
          // and runner rebuilt in either order fail gracefully.
          if (descriptor.kind === 'local' || descriptor.blob) {
            const file = descriptor.file || descriptor.blob;
            if (!file || typeof file.slice !== 'function' ||
                !Number.isSafeInteger(file.size))
              throw new Error('invalid local browser file');
            return { kind: 'local', path: descriptor.path, file, size: file.size };
          }
          if (descriptor.kind === 'http') {
            if (typeof descriptor.url !== 'string' ||
                !Number.isSafeInteger(descriptor.size) || descriptor.size < 0)
              throw new Error('invalid remote browser file');
            return {
              kind: 'http',
              path: descriptor.path,
              url: new URL(descriptor.url, location.href).href,
              size: descriptor.size,
            };
          }
          throw new Error('unknown browser file source');
        });
      }

      // BrowserFileSource.start() is called from GNU Radio's scheduler-launch
      // pthread and proxies here only to create a dedicated reader worker. The
      // reader and DSP block then communicate exclusively through atomics in a
      // fixed-size ring in shared WebAssembly.Memory.
      let nextFileReaderId = 1;
      const fileReaders = new Map();
      window.__grFileStats = Object.create(null);
      window.__grStartBrowserFileSource = (
        path, memory, ringPointer, capacityItems, itemSize,
        controlPointer, errorPointer, offsetItems, lengthItems, repeat
      ) => {
        const source = window.__grInputSources && window.__grInputSources[path];
        if (!source) throw new Error(`file is not bound in this session: ${path}`);
        const id = nextFileReaderId++;
        const workerUrl = new URL('browser_file_reader.js', location.href);
        if (window.__grBuildStamp) workerUrl.searchParams.set('v', window.__grBuildStamp);
        const worker = new Worker(workerUrl);
        const stats = {
          path,
          ringBytes: capacityItems * itemSize,
          maxChunkBytes: 0,
          bytesRead: 0,
          state: 'starting',
        };
        window.__grFileStats[id] = stats;
        fileReaders.set(id, worker);
        worker.onmessage = event => {
          const message = event.data || {};
          if (Number.isFinite(message.bytesRead)) stats.bytesRead = message.bytesRead;
          if (Number.isFinite(message.maxChunkBytes))
            stats.maxChunkBytes = Math.max(stats.maxChunkBytes, message.maxChunkBytes);
          if (message.type) stats.state = message.type;
          if (message.type === 'error') console.error(`File Source ${path}: ${message.message}`);
          if (message.type === 'eof' || message.type === 'cancelled' || message.type === 'error')
            fileReaders.delete(id);
        };
        worker.onerror = event => {
          stats.state = 'error';
          console.error(`File Source worker ${path}: ${event.message || 'worker error'}`);
          fileReaders.delete(id);
        };
        worker.postMessage({
          source,
          memory,
          ringPointer,
          capacityItems,
          itemSize,
          controlPointer,
          errorPointer,
          errorCapacity: 512,
          offsetItems,
          lengthItems,
          repeat,
        });
        stats.state = 'running';
        return id;
      };
      window.__grStopBrowserFileSource = id => {
        const worker = fileReaders.get(id);
        if (worker) worker.terminate();
        fileReaders.delete(id);
        const stats = window.__grFileStats[id];
        if (stats && stats.state !== 'eof' && stats.state !== 'error')
          stats.state = 'cancelled';
      };

      // Embedded Python Block: the Pyodide worker and the prepare step.
      //
      // The C++ side cannot wait for Python at construction time (see
      // blocks/src/python_block.hpp), so gr_run_json pauses the whole flowgraph
      // here instead: __grPyodidePrepare starts the worker, has it instantiate
      // every Python Block, and calls back into _gr_finish_pyodide_prepare with
      // the answer. Each block's constructor then reads its own description
      // synchronously through __grPyodideDescription and posts its control block
      // through __grPyodideBindBlock.
      //
      // One worker for the whole flowgraph: Python Blocks then serialize against
      // each other, exactly as the GIL makes them serialize in desktop GNU Radio.
      // Widths of the control block in blocks/src/python_block.hpp, passed on to
      // the worker so a mismatch is an error message rather than a wild write.
      const PYTHON_MAX_PORTS = 32;
      const PYTHON_CONTROL_WORDS = 10 + 5 * PYTHON_MAX_PORTS;
      const PYTHON_DOUBLE_SLOTS = 2 * PYTHON_MAX_PORTS + 32;

      let pyodideWorker = null;
      const pyodideDescriptions = Object.create(null);
      window.__grPyodideDescription = name => pyodideDescriptions[name] || null;

      window.__grPyodidePrepare = requestJson => {
        // __grPyodideBridge is installed by prepare_python_then_run in
        // runner.cpp: this page cannot reach the module's exports or its memory
        // on its own.
        const bridge = window.__grPyodideBridge;
        let request;
        try {
          request = JSON.parse(requestJson);
        } catch (error) {
          bridge.finish(false, 'malformed prepare request: ' + error.message);
          return;
        }
        queueStdout('Python Block: starting the Python runtime (about 16 MB, once per visit)');
        const workerUrl = new URL('pyodide/gr_pyodide_worker.js', location.href);
        if (window.__grBuildStamp) workerUrl.searchParams.set('v', window.__grBuildStamp);
        const worker = new Worker(workerUrl, { type: 'module' });
        pyodideWorker = worker;
        let settled = false;
        const fail = message => {
          if (settled) return;
          settled = true;
          bridge.finish(false, message);
        };
        worker.onerror = event => fail(event.message || 'Python worker failed to start');
        worker.onmessage = event => {
          const message = event.data || {};
          if (message.type === 'print') { console.log(message.line); queueStdout(message.line); return; }
          if (message.type === 'ready') {
            worker.postMessage({
              type: 'prepare',
              blocks: request.blocks,
              scope: request.scope,
              controlWords: PYTHON_CONTROL_WORDS,
              doubleSlots: PYTHON_DOUBLE_SLOTS,
            });
            return;
          }
          if (message.type === 'prepared') {
            Object.assign(pyodideDescriptions, message.descriptions);
            if (settled) return;
            settled = true;
            bridge.finish(true, '');
            return;
          }
          if (message.type === 'failed') { fail(message.message); return; }
        };
        worker.postMessage({
          type: 'init',
          indexURL: new URL('/pyodide/', location.href).href,
          shimURL: new URL('pyodide/py/', location.href).href,
        });
      };

      window.__grPyodideBindBlock = (
        name, controlPointer, doublePointer, textPointer, textCapacity,
        controlWords, doubleSlots
      ) => {
        if (!pyodideWorker) return false;
        if (controlWords !== PYTHON_CONTROL_WORDS || doubleSlots !== PYTHON_DOUBLE_SLOTS) {
          console.error(`Python Block ${name}: control block is ${controlWords}/${doubleSlots} ` +
            `words, runner.html expects ${PYTHON_CONTROL_WORDS}/${PYTHON_DOUBLE_SLOTS}`);
          return false;
        }
        pyodideWorker.postMessage({
          type: 'bind',
          name,
          memory: window.__grPyodideBridge.memory,
          controlPointer,
          doublePointer,
          textPointer,
          textCapacity,
        });
        return true;
      };

      // gr-paint's Image File Source, decoded by the browser.
      //
      // Upstream is a Python block that opens a local file with PIL. There is
      // no PIL and no filesystem here, so the block names its image either with
      // a URL or with the /local-files/... path the editor binds a
      // browser-picked File to, and this decodes it with the platform's own
      // image support, applying the same pipeline the Python does: grayscale,
      // optional autocontrast, optional inversion, optional flip, downscale to
      // the Spectrum Painter's 4096px limit, and the ITU-R BT.709 level
      // mapping.
      //
      // ImageSourceWasm (blocks/overlays/gr-paint/paint_image_source.cpp) drives
      // this in two steps, because a decode is asynchronous and a GNU Radio
      // constructor is not:
      // __grLoadImageSource starts the job and returns an id immediately,
      // and __grTakeImageSource copies the finished pixels into WASM memory
      // once the block's own scheduler thread has waited for the state word.
      const IMAGE_SOURCE_STATE = { loading: 0, ready: 1, failed: 2 };
      const imageSourceJobs = new Map();
      let nextImageSourceId = 1;

      // The bytes behind the block's Image File parameter. A local image picked
      // with Properties > Browse arrives as the same session-only File binding
      // File Source uses, so it is read straight out of the page and never
      // touches the network; anything else is a URL to fetch.
      const imageSourceBlob = async name => {
        const bound = window.__grInputSources && window.__grInputSources[name];
        if (bound) {
          if (bound.kind !== 'local' || !bound.file)
            throw new Error(`${name} is not bound to a local image in this session`);
          return bound.file;
        }
        // Cross-origin isolation means an image from another origin has to be
        // served with permissive CORS headers; without them the fetch fails
        // here rather than tainting a canvas later, which is the clearer
        // failure of the two.
        const response = await fetch(name, { mode: 'cors', credentials: 'omit' });
        if (!response.ok)
          throw new Error(`HTTP ${response.status} ${response.statusText} for ${name}`);
        return await response.blob();
      };

      // PNG, JPEG, GIF, WebP and BMP all decode through createImageBitmap.
      // SVG does not — Chrome refuses an SVG blob there — and an <img> element
      // is the one decoder in a page that rasterizes one, so that is the
      // fallback. It rasterizes at the SVG's intrinsic size (the browser's
      // 300x150 default when the file declares neither width nor height), so
      // an SVG paints at whatever resolution it was authored for rather than
      // at some size chosen here. The blob is same-origin either way — a
      // remote image was already fetched with CORS above — so the canvas it is
      // drawn on stays readable by getImageData.
      const decodeImageSourceBlob = async (blob, name) => {
        try {
          const bitmap = await createImageBitmap(blob);
          if (bitmap.width && bitmap.height)
            return {
              image: bitmap,
              width: bitmap.width,
              height: bitmap.height,
              release: () => bitmap.close(),
            };
          bitmap.close();
        } catch (error) {
          // Not a format createImageBitmap handles; try the <img> path below.
        }
        const objectUrl = URL.createObjectURL(blob);
        const image = new Image();
        try {
          await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = () =>
              reject(new Error(`the browser could not decode ${name} as an image`));
            image.src = objectUrl;
          });
        } catch (error) {
          URL.revokeObjectURL(objectUrl);
          throw error;
        }
        return {
          image,
          width: image.naturalWidth || image.width,
          height: image.naturalHeight || image.height,
          release: () => URL.revokeObjectURL(objectUrl),
        };
      };

      window.__grLoadImageSource = (
        url, memory, controlPointer, errorPointer, errorCapacity,
        maxWidth, maxPixels, flip, bt709Map, invert, autocontrast
      ) => {
        const id = nextImageSourceId++;
        const job = { pixels: null, released: false };
        imageSourceJobs.set(id, job);

        const control = new Int32Array(memory.buffer, controlPointer, 4);
        const finish = (state, width, height) => {
          if (job.released) return;
          Atomics.store(control, 1, width | 0);
          Atomics.store(control, 2, height | 0);
          Atomics.store(control, 0, state);
          Atomics.notify(control, 0);
        };
        const fail = error => {
          if (job.released) return;
          const text = String((error && error.message) || error || 'image load failed');
          const bytes = new TextEncoder().encode(text).subarray(0, errorCapacity - 1);
          new Uint8Array(memory.buffer, errorPointer, errorCapacity).set(bytes);
          Atomics.store(control, 3, bytes.length);
          finish(IMAGE_SOURCE_STATE.failed, 0, 0);
        };

        (async () => {
          const decoded = await decodeImageSourceBlob(await imageSourceBlob(url), url);

          let width = decoded.width;
          let height = decoded.height;
          if (!width || !height) {
            decoded.release();
            throw new Error('the image has no pixels');
          }
          if (width > maxWidth) {
            const scale = maxWidth / width;
            width = Math.floor(width * scale);
            height = Math.max(1, Math.floor(height * scale));
          }
          if (width * height > maxPixels) {
            decoded.release();
            throw new Error(
              `image is too large: ${width}x${height} px exceeds the ` +
              `${maxPixels} px limit`);
          }

          const canvas = new OffscreenCanvas(width, height);
          const context = canvas.getContext('2d', { willReadFrequently: true });
          context.imageSmoothingQuality = 'high';
          // For waterfalls that scroll from the top. Flipping while drawing
          // costs nothing, where PIL needs a second pass over the pixels.
          if (flip) { context.translate(0, height); context.scale(1, -1); }
          context.drawImage(decoded.image, 0, 0, width, height);
          decoded.release();

          const rgba = context.getImageData(0, 0, width, height).data;
          const luma = new Uint8Array(width * height);
          // PIL's ImageOps.grayscale is convert("L"), i.e. the ITU-R 601-2
          // luma coefficients. Alpha is ignored, as it is there; a transparent
          // PNG therefore comes out over black.
          for (let i = 0, p = 0; i < luma.length; i++, p += 4)
            luma[i] = (rgba[p] * 299 + rgba[p + 1] * 587 + rgba[p + 2] * 114) / 1000;

          if (autocontrast) {
            // ImageOps.autocontrast with the default cutoff: stretch the
            // extremes to the full range through a truncating LUT.
            let low = 255, high = 0;
            for (let i = 0; i < luma.length; i++) {
              if (luma[i] < low) low = luma[i];
              if (luma[i] > high) high = luma[i];
            }
            if (high > low) {
              const scale = 255 / (high - low);
              for (let i = 0; i < luma.length; i++)
                luma[i] = Math.min(255, Math.max(0, Math.trunc((luma[i] - low) * scale)));
            }
          }
          if (invert)
            for (let i = 0; i < luma.length; i++) luma[i] = 255 - luma[i];
          if (bt709Map)
            // Scale brightness into the BT.709 studio range, 16..235.
            for (let i = 0; i < luma.length; i++)
              luma[i] = Math.floor(luma[i] * 219 / 255) + 16;

          job.pixels = luma;
          finish(IMAGE_SOURCE_STATE.ready, width, height);
        })().catch(fail);

        return id;
      };

      window.__grTakeImageSource = (id, memory, destinationPointer, byteLength) => {
        const job = imageSourceJobs.get(id);
        if (!job || !job.pixels || job.pixels.length !== byteLength) return 0;
        new Uint8Array(memory.buffer, destinationPointer, byteLength).set(job.pixels);
        imageSourceJobs.delete(id);
        return 1;
      };

      window.__grReleaseImageSource = id => {
        const job = imageSourceJobs.get(id);
        if (job) job.released = true;   // a decode still in flight writes nothing
        imageSourceJobs.delete(id);
      };

      // Mirror the flowgraph's stdout into the editor's console pane.
      //
      // Blocks that report to the user do it by printing: Message Debug dumps
      // each PDU, Print Header / Print Timestamp annotate frames. Emscripten
      // sends that to console.log, which means devtools — so from the editor a
      // decoding flowgraph looks like it produced nothing. Forward it to the
      // parent frame, which appends it to the log under the canvas.
      //
      // Batched and capped on purpose: a Message Debug on a fast frame source
      // emits several hundred lines a second, and one postMessage per line
      // would swamp both this frame and the editor's DOM.
      const STDOUT_FLUSH_MS = 100;      // coalesce bursts into ~10 posts/second
      const STDOUT_MAX_BATCH = 200;     // lines kept per flush; the rest counted
      let stdoutQueue = [], stdoutDropped = 0, stdoutTimer = 0;

      function flushStdout() {
        stdoutTimer = 0;
        if (!stdoutQueue.length && !stdoutDropped) return;
        const lines = stdoutQueue;
        const dropped = stdoutDropped;
        stdoutQueue = [];
        stdoutDropped = 0;
        window.parent.postMessage({ type: 'gr-print', lines, dropped }, '*');
      }

      function queueStdout(text) {
        if (!(window.parent && window.parent !== window)) return;
        if (stdoutQueue.length >= STDOUT_MAX_BATCH) stdoutDropped++;
        else stdoutQueue.push(String(text));
        if (!stdoutTimer) stdoutTimer = setTimeout(flushStdout, STDOUT_FLUSH_MS);
      }

      // The editor's Arrange overlay drags a live widget around and sends the
      // new grid down here, where it is applied to the running flowgraph in
      // place: the plots keep plotting, nothing is rebuilt, and the flowgraph
      // never restarts. The editor owns the packing rules (one implementation,
      // in editor/src/gui-layout.ts) and this end only renders what it is sent.
      window.addEventListener('message', event => {
        const data = event.data;
        if (!data || data.type !== 'gr-set-layout') return;
        // Only the frame that embedded this one has any business rearranging it.
        if (event.source !== window.parent) return;
        const instance = window.__grRunnerInstance;
        if (!instance) return;   // still loading; the run picks the spec up itself
        // Qt's qtLoad() resolves to the Emscripten module, but not with ccall or
        // malloc on it -- only the string helpers and the raw exports. The spec
        // is a few hundred bytes, so the stack is the right place for it and
        // needs no allocator.
        const stack = instance.stackSave();
        try {
          instance._gr_apply_gui_layout(
            instance.stringToUTF8OnStack(String(data.tiles || '{}')),
            Number(data.columns) || 12, Number(data.rowHeight) || 60);
        } finally {
          instance.stackRestore(stack);
        }
      });

      async function init()
      {
        const spinner = document.querySelector('#qtspinner');
        const screen = document.querySelector('#screen');
        const status = document.querySelector('#qtstatus');

        const showUi = (ui) => {
          [spinner, screen].forEach(element => element.style.display = 'none');
          if (screen === ui)
            screen.style.position = 'default';
          ui.style.display = 'block';
        }

        try {
          showUi(spinner);
          status.textContent = 'Loading…';
          const inputSources = inputSourcesForRun();
          if (flowgraphUsesFosphorSink()) {
            status.textContent = 'Initializing WebGPU…';
            await window.__grFosphorWebGpu.prepare();
          }
          status.textContent = 'Loading GNU Radio…';
          window.__grInputSources = Object.create(null);
          for (const source of inputSources)
            window.__grInputSources[source.path] = source;
          window.__grMountedRecordings = inputSources.map(source => source.path);

          const instance = await qtLoad({
            // runner.js and runner.wasm are one indivisible build: emcc bakes
            // the EM_ASM string addresses of THIS link into runner.js's
            // ASM_CONSTS table, and those addresses move on every link. A
            // runner.js kept from an earlier deploy next to a freshly fetched
            // runner.wasm therefore dies on main()'s first EM_ASM with
            // "ASM_CONSTS[code] is not a function" — which is what a browser
            // does when it reuses the 1.2 MB script from its in-memory cache but
            // goes back to the network for the 19.5 MB wasm. Neither file has a
            // version in its name, so scripts/assemble-site.mjs stamps a
            // per-build id into this page (always fetched fresh: the editor
            // gives it a unique recordingToken) and onto the <script> srcs
            // below; carry it onto the files the runtime fetches by itself —
            // runner.wasm and the dlopen'd category side modules — so one
            // build's artifacts can only ever load as a set. Unstamped (dev
            // server, smoke tests, where the tree is always self-consistent)
            // __grBuildStamp is undefined and this hook stays inert.
            locateFile: window.__grBuildStamp
              ? (path, prefix) => `${prefix ?? ''}${path}?v=${window.__grBuildStamp}`
              : undefined,
            // Emscripten's stdout hook. Keep the console.log so devtools and the
            // headless tests still see it, and mirror it to the editor.
            print: (text) => { console.log(text); queueStdout(text); },
            qt: {
              onLoaded: () => showUi(screen),
              onExit: exitData =>
              {
                status.textContent = 'Application exit';
                status.textContent +=
                  exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                status.textContent +=
                  exitData.text !== undefined ? ` (${exitData.text})` : '';
                showUi(spinner);
              },
              entryFunction: window.runner_entry,
              containerElements: [screen],
            }
          });
          window.__grRunnerInstance = instance;
        } catch (error) {
          console.error(error);
          console.error(error.stack);
          status.textContent = `Runner failed: ${error.message || error}`;
          showUi(spinner);
        }
      }
    </script>
    <script src="fosphor_webgpu.js"></script>
    <script src="runner.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
