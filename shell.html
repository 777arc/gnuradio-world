<!doctype html>
<html>
<head><meta charset="utf-8"><title>GNU Radio WASM</title></head>
<body>
<canvas id="canvas" width="10" height="10" style="display:none"></canvas>
<div id="stage">STAGE: (none)</div>
<div id="result" data-status="pending">RESULT: pending</div>
<pre id="log" style="max-height:60vh;overflow:auto"></pre>
<script type="text/javascript">
  // Route all Emscripten stdout/stderr (including from proxied pthreads) into the
  // #log div so headless --dump-dom captures it. Surface aborts as a RESULT line.
  var logEl = document.getElementById('log');
  function append(s){ logEl.textContent += s + "\n"; }
  var Module = {
    print: (t) => append(t),
    printErr: (t) => append("[err] " + t),
    canvas: document.getElementById('canvas'),
    onAbort: (w) => {
      var d = document.getElementById('result');
      d.dataset.status = 'fail';
      d.textContent = 'RESULT: WASM_ABORT ' + w;
    },
  };
  window.onerror = (msg) => {
    var d = document.getElementById('result');
    if (d.dataset.status === 'pending') {
      d.dataset.status = 'fail';
      d.textContent = 'RESULT: WASM_ONERROR ' + msg;
    }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
