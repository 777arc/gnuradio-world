<!doctype html>
<!-- The built-in recording view: the second entry of the editor's Vite build,
     emitted at /recording/. The editor frames one of these per File Source.
     Adapted from IQEngine's client/index.html; the Pyodide <script> that shell
     loads off a CDN is deliberately absent, and so is the API/auth machinery. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#20232f" />
    <meta name="description" content="SigMF recording view: spectrogram, time/frequency/IQ plots, annotations and metadata" />
    <title>Recording View</title>
    <!-- Not a page anyone should reach from a search result: the viewer is
         framed by the editor, and the recording it shows is addressed by URL
         fragment, so on its own this renders "No recording selected." -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <style>
      /* The viewer is framed inside the editor, so the page itself never scrolls
         sideways and the body carries the theme background from the first paint
         rather than flashing white while the bundle loads. */
      html, body { margin: 0; background: #20232f; font-family: system-ui, Arial, sans-serif; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/recording/index.tsx"></script>
  </body>
</html>
