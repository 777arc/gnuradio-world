<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GNU Radio — WebAssembly Flowgraph Editor</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:system-ui,Arial,sans-serif; color:#e6e9f0; background:#1e2230; }
  #app { --palette-width:230px; display:grid;
      grid-template-columns:var(--palette-width) 1fr 260px; grid-template-rows:44px 1fr; height:100vh; }
  #app.hide-palette { --palette-width:0px; }
  #app.hide-palette #palette { visibility:hidden; overflow:hidden; }
  header { grid-column:1/4; display:flex; align-items:center; gap:10px; padding:0 12px; background:#181b26; border-bottom:1px solid #333a4d; }
  header h1 { font-size:14px; font-weight:600; margin:0; color:#aebbd6; }
  header .spacer { flex:1; }
  button { background:#2f3650; color:#e6e9f0; border:1px solid #46507a; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button.run { background:#2e7d46; border-color:#3fae63; font-weight:600; }
  button:hover { filter:brightness(1.15); }
  #palette, #props { min-height:0; background:#20232f; overflow:auto; }
  #palette { border-right:1px solid #333a4d; }
  #props { border-left:1px solid #333a4d; }
  #workspace { min-width:0; min-height:0; display:grid; --run-pane-height:0px;
      grid-template-rows:minmax(0,1fr) 0 0;
      overflow:hidden; transition:grid-template-rows .18s ease; }
  #workspace.running { grid-template-rows:minmax(120px,1fr) 7px var(--run-pane-height); }
  #workspace.resizing { transition:none; cursor:row-resize; }
  #workspace.resizing iframe { pointer-events:none; }
  #paneSplitter { min-height:0; height:7px; position:relative; z-index:20; cursor:row-resize;
      touch-action:none; visibility:hidden; background:#262b3b; border-top:1px solid #46507a;
      border-bottom:1px solid #11141d; outline:none; }
  #workspace.running #paneSplitter { visibility:visible; }
  #paneSplitter::after { content:''; position:absolute; width:42px; height:2px; border-radius:2px;
      background:#7783a4; left:50%; top:2px; transform:translateX(-50%); }
  #paneSplitter:hover, #paneSplitter:focus-visible { background:#343b52; }
  #paneSplitter:hover::after, #paneSplitter:focus-visible::after { background:#b9c5e3; }
  /* GRC-style block tree */
  .palsearch { width:calc(100% - 16px); margin:8px; padding:6px 8px; background:#171a24; color:#e6e9f0;
      border:1px solid #3a4366; border-radius:5px; font-size:13px; outline:none; }
  .palsearch::placeholder { color:#6b768f; }
  .tree { padding-bottom:14px; }
  .cat-row { display:flex; align-items:center; gap:3px; padding:3px 8px 3px 0; cursor:pointer;
      font-size:13px; color:#c3cbe0; user-select:none; white-space:nowrap; }
  .cat-row:hover { background:#2a2f42; }
  .tri { width:12px; min-width:12px; text-align:center; font-size:9px; color:#7f8bab; }
  .pal-item { padding:3px 8px 3px 0; font-size:13px; cursor:pointer; color:#aeb8d0;
      user-select:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pal-item:hover { background:#2a2f42; color:#fff; }
  .pal-item.runnable { color:#dde7f6; }
  .pal-item.runnable::before { content:'\25CF'; color:#3fae63; font-size:8px; vertical-align:middle; margin-right:6px; }
  .pal-item.unavailable { color:#687083; cursor:not-allowed; }
  .pal-item.unavailable:hover { background:#252938; color:#7a8295; }
  .pal-item.unavailable::before { content:'\25CF'; color:#4b5160; font-size:8px; vertical-align:middle; margin-right:6px; }
  /* GRC-authentic light canvas */
  #canvasWrap { --grid-size:16px; min-height:0; position:relative; overflow:hidden; background:
      linear-gradient(#e9eaec 1px, transparent 1px) 0 0/100% var(--grid-size),
      linear-gradient(90deg, #e9eaec 1px, transparent 1px) 0 0/var(--grid-size) 100%, #f7f7f7; }
  #canvasWrap.grid-hidden { background:#f7f7f7; }
  #canvasWrap.console-hidden #log { display:none; }
  svg { width:100%; height:100%; display:block; }
  svg text { user-select:none; -webkit-user-select:none; -moz-user-select:none; }
  /* GRC block: light body, black border, bold black title, param rows */
  .blk { cursor:move; }
  .blk rect.body { fill:#f2f2f2; stroke:#000; stroke-width:1; }
  .blk.sel rect.body { fill:#e3f0ff; stroke:#1a63c4; stroke-width:2; }
  .blk.invalid rect.body { fill:#fff0f0; stroke:#d1242f; stroke-width:2; }
  .blk.invalid text.title { fill:#a40e26 !important; }
  .blk text.title { fill:#000; font-size:13px; font-weight:700; font-family:'DejaVu Sans',Verdana,sans-serif; }
  .blk text.param { fill:#111; font-size:11px; font-family:'DejaVu Sans',Verdana,sans-serif; }
  .blk text.pval { fill:#1a63c4; }
  .blk text.param.invalid, .blk text.param.invalid .pval { fill:#d1242f; font-weight:700; }
  .blk text.validation-error { fill:#d1242f; font:10px 'DejaVu Sans',Verdana,sans-serif; pointer-events:none; }
  .port { stroke:#000; stroke-width:1; cursor:crosshair; }
  .port:hover { stroke:#1a63c4; stroke-width:2; }
  .wire { stroke:#2a2a2a; stroke-width:2; fill:none; pointer-events:none; }
  .wire.sel { stroke:#00b8c8; stroke-width:3; }
  .wire.invalid { stroke:#d1242f; stroke-width:3; }
  .wire-hit { stroke:transparent; stroke-width:12; fill:none; cursor:pointer; pointer-events:stroke; }
  /* disabled block (GRC greys it out) */
  .blk.disabled rect.body { fill:#e6e6e6; stroke:#9a9a9a; stroke-dasharray:5 3; }
  .blk.disabled text.title, .blk.disabled text.param, .blk.disabled text.pval { fill:#9a9a9a; }
  .blk.disabled .port { opacity:.35; }
  /* bypassed block (GRC pale look, distinct from disabled) */
  .blk.bypassed rect.body { fill:#fff4d6; stroke:#b8973a; stroke-dasharray:6 3; }
  .blk.bypassed text.title { fill:#7a5c12; }
  .blk.disabled.invalid rect.body, .blk.bypassed.invalid rect.body { fill:#fff0f0; stroke:#d1242f; }
  .blk.disabled.invalid text.title, .blk.bypassed.invalid text.title { fill:#a40e26; }
  /* right-click context menu */
  .ctxmenu { position:fixed; z-index:200; background:#272c3d; border:1px solid #46507a;
      border-radius:6px; padding:4px 0; min-width:158px; box-shadow:0 8px 26px #000a; font-size:13px; }
  .ctxitem { padding:6px 16px; cursor:pointer; color:#e6e9f0; white-space:nowrap; }
  .ctxitem:hover { background:#38415f; }
  .ctxitem.danger { color:#ff7b72; }
  .ctxsep { height:1px; background:#46507a; margin:4px 0; }
  /* block Properties dialog (GRC-style modal) */
  .modal { position:fixed; inset:0; background:#0009; display:flex; align-items:center; justify-content:center; z-index:150; }
  .dlg { width:440px; max-height:82vh; background:#20232f; border:1px solid #46507a; border-radius:8px;
      display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 44px #000b; }
  .dlghead { padding:12px 16px; font-size:14px; font-weight:600; color:#dce3f5; border-bottom:1px solid #333a4d; }
  .dlgtabs { display:flex; gap:2px; padding:8px 12px 0; border-bottom:1px solid #333a4d; overflow-x:auto; flex:none; }
  .dlgtab { padding:7px 12px; border:1px solid transparent; border-bottom:0; border-radius:5px 5px 0 0;
      background:transparent; color:#9aa7c6; white-space:nowrap; }
  .dlgtab:hover { background:#292e3e; color:#dce3f5; }
  .dlgtab.active { background:#20232f; color:#e6e9f0; border-color:#46507a; margin-bottom:-1px; }
  .dlgbody { padding:8px 16px 14px; overflow:auto; }
  .dlgpanel[hidden] { display:none; }
  .dlgrow { display:grid; grid-template-columns:1fr 1.25fr; gap:12px; align-items:center; margin:9px 0; }
  .dlgrow label { font-size:12px; color:#9aa7c6; text-align:right; }
  .dlgrow input, .dlgrow select { background:#171a24; color:#e6e9f0; border:1px solid #3a4366;
      border-radius:5px; padding:6px 8px; font-size:13px; width:100%; }
  .field-control { min-width:0; }
  .field-error { display:block; color:#ff7b72; font-size:10px; line-height:1.3; margin-top:3px; }
  .field-error[hidden] { display:none; }
  .field-invalid { border-color:#ff4d5e !important; box-shadow:0 0 0 1px #ff4d5e66; }
  .dlgfoot { padding:10px 16px; display:flex; gap:8px; justify-content:flex-end; border-top:1px solid #333a4d; }
  .shortcut-dlg { width:min(760px,92vw); }
  .shortcut-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 24px; }
  .shortcut-row { display:grid; grid-template-columns:145px 1fr; gap:10px; padding:5px 0;
      border-bottom:1px solid #303548; font-size:12px; }
  .shortcut-row kbd { color:#fff; font:12px/1.4 monospace; }
  .shortcut-note { color:#9aa7c6; font-size:12px; margin:0 0 10px; }
  #props label { display:block; font-size:11px; color:#9aa7c6; margin:8px 12px 2px; }
  #props .field-control { margin:0 12px; }
  #props input, #props select { width:100%; margin:0; background:#171a24; color:#e6e9f0;
      border:1px solid #3a4366; border-radius:5px; padding:5px 7px; font-size:13px; }
  #props .title { font-size:14px; font-weight:600; padding:12px; border-bottom:1px solid #333a4d; }
  #log { position:absolute; bottom:0; left:0; right:0; max-height:26%; overflow:auto; background:#141722ee;
      font:12px/1.5 monospace; padding:6px 10px; color:#a8b6d6; border-top:1px solid #333a4d; }
  #runPane { min-height:0; display:flex; flex-direction:column; overflow:hidden; background:#20232f;
      border-top:2px solid #46507a; }
  #runPane[hidden] { display:none; }
  #runBar { min-height:38px; padding:5px 10px; display:flex; align-items:center; gap:10px;
      border-bottom:1px solid #333a4d; color:#dce3f5; font-size:13px; }
  #runBar .spacer { flex:1; }
  #runFrame { min-height:0; flex:1; display:block; width:100%; border:0; background:#fff; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>GNU Radio · WebAssembly Flowgraph Editor</h1>
    <span class="spacer"></span>
    <button id="btnClear">Clear</button>
    <button id="btnExport">Export JSON</button>
    <button id="btnKeys" title="Keyboard shortcuts (Ctrl+K)">⌨ Keys</button>
    <button id="btnRun" class="run">▶ Run</button>
  </header>
  <div id="palette"></div>
  <div id="workspace">
    <div id="canvasWrap">
      <svg id="svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#2a2a2a"/>
          </marker>
          <marker id="arrow-selected" viewBox="0 0 10 10" refX="8.5" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#00b8c8"/>
          </marker>
        </defs>
        <g id="wires"></g><g id="nodes"></g>
      </svg>
      <div id="log"></div>
    </div>
    <div id="paneSplitter" role="separator" aria-label="Resize flowgraph and runner panes"
         aria-orientation="horizontal" aria-valuemin="15" aria-valuemax="85"
         aria-valuenow="50" tabindex="0"></div>
    <section id="runPane" hidden>
      <div id="runBar"><b>Running flowgraph…</b><span class="spacer"></span><button id="btnStop">✕ Stop</button></div>
      <iframe id="runFrame" title="Running GNU Radio flowgraph"></iframe>
    </section>
  </div>
  <div id="props"><div class="title">Properties</div><div id="propBody" style="padding:12px;color:#7f8bab;font-size:13px;white-space:pre-line">Select a block or connection…</div></div>
</div>
<input id="fileOpen" type="file" accept="application/json,.json" hidden />
<script type="module" src="/src/main.ts"></script>
</body>
</html>
