<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone lays the page out at 980px and scales it down, which is
     what made every control unreadably small. viewport-fit=cover pairs with the
     safe-area insets the mobile rules in editor.css apply. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#181b26" />
<title>GNU Radio World</title>
<link rel="stylesheet" href="/src/editor.css" />
</head>
<body>
<div id="app">
  <header>
    <div id="menubar">
      <!-- Opens the palette drawer; only the narrow layout shows it, where the
           palette overlays the canvas instead of sitting beside it. -->
      <button id="paletteToggle" type="button" aria-controls="palette" aria-expanded="false"
              aria-label="Show block palette" title="Show block palette">☰</button>
      <span class="brand"><img src="/gnuradio_world_logo.svg" alt="GNU Radio World" /></span>
      <nav id="menus" role="menubar" aria-label="Main menu"></nav>
      <a class="github-link" href="https://github.com/777arc/gnuradio-world"
         target="_blank" rel="noopener noreferrer" aria-label="View 777arc/gnuradio-world on GitHub"
         title="777arc/gnuradio-world on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.42c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.74-1.55-2.57-.3-5.28-1.29-5.28-5.69 0-1.26.45-2.29 1.19-3.1-.12-.3-.52-1.47.11-3.06 0 0 .97-.31 3.16 1.18a10.93 10.93 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.59.23 2.76.12 3.06.74.81 1.18 1.84 1.18 3.1 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.79.56A11.5 11.5 0 0 0 12 .7Z"/>
        </svg>
      </a>
    </div>
    <div id="toolbar" role="toolbar" aria-label="Editor toolbar"></div>
  </header>
  <div id="palette"></div>
  <!-- Dismisses the palette drawer by tapping the canvas behind it. Inert (and
       invisible) in the side-by-side layout, where the palette is not an overlay. -->
  <div id="paletteScrim" hidden></div>
  <div id="paletteSplitter" role="separator" aria-label="Resize block palette"
       aria-orientation="vertical" aria-valuemin="180" aria-valuemax="900"
       aria-valuenow="460" tabindex="0"></div>
  <div id="workspace">
    <div id="workspaceTabs" role="tablist" aria-label="Workspace views">
      <button id="tabEditor" class="workspace-tab active" type="button" role="tab"
              aria-controls="editorPane" aria-selected="true">Editor</button>
      <button id="tabQtGui" class="workspace-tab" type="button" role="tab"
              aria-controls="runPane" aria-selected="false" tabindex="-1">
        QT GUI <span id="runIndicator" aria-hidden="true"></span>
      </button>
    </div>
    <div id="workspaceContent">
      <div id="editorPane" class="workspace-panel" role="tabpanel" aria-labelledby="tabEditor">
        <div id="canvasWrap">
          <div id="canvasScroll">
            <svg id="svg">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
                        markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#2a2a2a"/>
                </marker>
                <marker id="arrow-selected" viewBox="0 0 10 10" refX="8.5" refY="5"
                        markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#00b8c8"/>
                </marker>
                <!-- Sized in user space to match the 7x7 stroke-width marker on a 2px
                     wire, so the thicker invalid wire does not scale its arrowhead up. -->
                <marker id="arrow-invalid" viewBox="0 0 10 10" refX="8.5" refY="5"
                        markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14"
                        orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/>
                </marker>
              </defs>
              <g id="wires"></g><g id="nodes"></g><g id="selectionOverlay"></g>
            </svg>
          </div>
        </div>
      </div>
      <section id="runPane" class="workspace-panel" role="tabpanel" aria-labelledby="tabQtGui" hidden>
        <div id="runBar">
          <b id="runStatus">No flowgraph running</b>
          <span class="spacer"></span>
          <button id="btnStop" disabled>✕ Stop</button>
        </div>
        <div id="runEmpty">Run a flowgraph to open its QT GUI here.</div>
        <iframe id="runFrame" title="GNU Radio QT GUI" hidden></iframe>
      </section>
    </div>
    <div id="consoleSplitter" role="separator" aria-label="Resize console"
         aria-orientation="horizontal" aria-valuemin="29" tabindex="0"></div>
    <!-- Collapses the console. Only the narrow layout shows it, where the 7px
         splitter above is too small to drag and the console is a third of the
         screen; it stays put while collapsed, so it can open the pane again. -->
    <button id="consoleToggle" type="button" aria-controls="log" aria-expanded="true">
      Console <span id="consoleToggleCaret" aria-hidden="true">▾</span>
    </button>
    <div id="log"></div>
  </div>
</div>
<input id="fileOpen" type="file" accept="application/json,.json" hidden />
<script type="module" src="/src/main.ts"></script>
</body>
</html>
