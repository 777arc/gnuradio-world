<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Without this a phone lays the page out at 980px and scales it down, which is
     what made every control unreadably small. viewport-fit=cover pairs with the
     safe-area insets the mobile rules in editor.css apply. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#181b26" />
<title>GNU Radio World</title>
<!-- Keep the click-to-load gate independent of the editor bundle: when both
     query flags are on, neither that bundle nor its stylesheet is requested
     until the reader presses Load. This tiny inline style is the entire gated
     screen. app-bootstrapping also prevents an unstyled flash on ordinary
     loads now that editor.css travels with the deferred module. -->
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const enabled = name => {
    const value = params.get(name);
    return value !== null && value !== '0' && value.toLowerCase() !== 'false';
  };
  document.documentElement.classList.add(
    enabled('embed') && enabled('click_to_load')
      ? 'click-to-load-pending'
      : 'app-bootstrapping',
  );
})();
</script>
<style>
html.app-bootstrapping body { visibility:hidden; }
#clickToLoad { display:none; }
html.click-to-load-pending body {
  margin:0; min-height:100vh; background:#1e2230;
}
html.click-to-load-pending body > :not(#clickToLoad) { display:none !important; }
html.click-to-load-pending #clickToLoad {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  overflow:hidden; background:url('/blurry_flowgraph.png') center / cover no-repeat;
}
html.click-to-load-pending #clickToLoad button {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  padding:10px 24px; border:1px solid #46507a; border-radius:6px;
  background:#2f3650; color:#e6e9f0; cursor:pointer;
  font:600 16px system-ui,Arial,sans-serif;
}
html.click-to-load-pending #clickToLoad button:hover { filter:brightness(1.15); }
html.click-to-load-pending #clickToLoad button:disabled { cursor:default; opacity:.75; }
</style>
</head>
<body>
<div id="clickToLoad">
  <button type="button">Load</button>
</div>
<div id="app">
  <header>
    <!-- Opens the palette drawer; only the narrow layout shows it, where the
         palette overlays the canvas instead of sitting beside it. -->
    <button id="paletteToggle" type="button" aria-controls="palette" aria-expanded="false"
            aria-label="Show block palette" title="Show block palette">☰</button>
    <!-- The logo stands beside the whole header rather than inside the menu row:
         both bars run to the right of it. The dark-background variant, because
         the app's chrome is dark and the light artwork's lettering disappears
         into it. README.md keeps the light one, which is what GitHub renders it
         against. -->
    <span class="brand"><a href="/" aria-label="GNU Radio World home"><img data-src="/gnuradio_world_logo_dark.svg" alt="GNU Radio World" /></a></span>
    <div id="headerBars">
    <div id="menubar">
      <nav id="menus" role="menubar" aria-label="Main menu"></nav>
      <a class="github-link" href="https://github.com/777arc/gnuradio-world"
         target="_blank" rel="noopener noreferrer" aria-label="View 777arc/gnuradio-world on GitHub"
         title="777arc/gnuradio-world on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.42c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.74-1.55-2.57-.3-5.28-1.29-5.28-5.69 0-1.26.45-2.29 1.19-3.1-.12-.3-.52-1.47.11-3.06 0 0 .97-.31 3.16 1.18a10.93 10.93 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.59.23 2.76.12 3.06.74.81 1.18 1.84 1.18 3.1 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.27c0 .31.21.67.79.56A11.5 11.5 0 0 0 12 .7Z"/>
        </svg>
      </a>
      <nav class="legal-links" aria-label="Legal">
        <a href="/privacy.html" target="_blank" rel="noopener">Privacy</a>
        <a href="/terms.html" target="_blank" rel="noopener">Terms</a>
      </nav>
    </div>
    <div id="toolbar" role="toolbar" aria-label="Editor toolbar"></div>
    </div>
  </header>
  <div id="palette"></div>
  <!-- Dismisses the palette drawer by tapping the canvas behind it. Inert (and
       invisible) in the side-by-side layout, where the palette is not an overlay. -->
  <div id="paletteScrim" hidden></div>
  <div id="paletteSplitter" role="separator" aria-label="Resize block palette"
       aria-orientation="vertical" aria-valuemin="180" aria-valuemax="900"
       aria-valuenow="460" tabindex="0"></div>
  <div id="workspace">
    <div id="workspaceTabs" role="tablist" aria-label="Workspace views">
      <button id="tabEditor" class="workspace-tab active" type="button" role="tab"
              aria-controls="editorPane" aria-selected="true">Editor</button>
      <button id="tabQtGui" class="workspace-tab" type="button" role="tab"
              aria-controls="runPane" aria-selected="false" tabindex="-1">
        QT GUI <span id="runIndicator" aria-hidden="true"></span>
      </button>
    </div>
    <div id="workspaceContent">
      <div id="editorPane" class="workspace-panel" role="tabpanel" aria-labelledby="tabEditor">
        <div id="canvasWrap">
          <div id="canvasScroll">
            <svg id="svg">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
                        markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#2a2a2a"/>
                </marker>
                <marker id="arrow-selected" viewBox="0 0 10 10" refX="8.5" refY="5"
                        markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#00b8c8"/>
                </marker>
                <!-- Sized in user space to match the 7x7 stroke-width marker on a 2px
                     wire, so the thicker invalid wire does not scale its arrowhead up. -->
                <marker id="arrow-invalid" viewBox="0 0 10 10" refX="8.5" refY="5"
                        markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14"
                        orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/>
                </marker>
              </defs>
              <g id="trainingWires"></g><g id="wires"></g>
              <g id="trainingNodes"></g><g id="nodes"></g><g id="selectionOverlay"></g>
            </svg>
          </div>
          <div id="trainingStatus" class="training-status" hidden></div>
        </div>
      </div>
      <section id="runPane" class="workspace-panel" role="tabpanel" aria-labelledby="tabQtGui" hidden>
        <div id="runBar">
          <b id="runStatus">No flowgraph running</b>
          <span class="spacer"></span>
          <!-- Rearranges the live widgets by dragging them, writing the result
               back into the flowgraph's GUI Layout block. -->
          <button id="btnArrange" disabled aria-pressed="false">⌗ Arrange</button>
          <button id="btnStop" disabled>✕ Stop</button>
        </div>
        <div id="runEmpty">Run a flowgraph to open its QT GUI here.</div>
        <div id="runStage">
          <!-- allow="usb": RTL-SDR Source reaches its dongle from inside this
               frame. The `usb` permission policy defaults to 'self', so a
               same-origin frame would normally inherit it, but an editor
               embedded cross-origin (?embed=1) only gets what its host grants —
               and being explicit here is what makes that failure legible rather
               than a NotFoundError from getDevices(). See docs/rtlsdr.md.
               allow="microphone" is Audio Source's half of the same story: the
               permission is granted on the Run click in *this* document and the
               frame's own getUserMedia() then inherits it. See docs/audio.md. -->
          <iframe id="runFrame" title="GNU Radio QT GUI" allow="usb; microphone" hidden></iframe>
          <!-- Drawn over the iframe, in the editor's own DOM: the runner reports
               where its grid is on screen and this positions handles to match,
               so all the drag logic stays in TypeScript. -->
          <div id="arrangeOverlay" hidden></div>
        </div>
      </section>
      <!-- The embedded layout (?embed=1) shows this pair of panels and nothing
           else, so neither the toolbar's ▶ nor the run bar's Stop is on screen.
           #embedRun is both: which pane is showing follows the run state there,
           so Run and Stop are the same control. #embedOpen is the way out of the
           frame and into the application, hence a real link rather than a button
           — it opens in a tab of its own, and middle-click and "copy link
           address" work as the reader expects. Hidden — and inert — in the full
           editor. -->
      <div id="embedControls" class="embed-controls" hidden>
        <button id="embedRun" class="embed-run" type="button">▶ Run</button>
        <!-- The corner carries the way out and the two zoom controls, which an
             embed has nowhere else: no toolbar, no menu bar, and Ctrl+± needs a
             keyboard the frame may not be in front of. `data-tool` is what
             setZoom() greys them out by, the same attribute the toolbar uses. -->
        <div class="embed-corner">
          <div id="embedZoom" class="embed-zoom">
            <button id="embedZoomIn" type="button" data-tool="Zoom In"
                    title="Zoom In (Ctrl++)" aria-label="Zoom in">🔍+</button>
            <button id="embedZoomOut" type="button" data-tool="Zoom Out"
                    title="Zoom Out (Ctrl+-)" aria-label="Zoom out">🔍−</button>
          </div>
          <!-- Two labels, one link: a frame narrow enough to be a phone has no room
               for the long one beside a centred Run, and the accessible name is on
               the anchor either way. -->
          <a id="embedOpen" class="embed-open" target="_blank" rel="noopener noreferrer"
             href="/" aria-label="Open this flowgraph in the full GNU Radio World editor"
             ><span class="embed-open-long">Open in GNU Radio World</span
             ><span class="embed-open-short">Open</span> ↗</a>
        </div>
      </div>
      <!-- ?no_controls=1 replaces the whole row above with just this: a lone Run
           control drawn to look exactly like a GRC block — same body fill,
           border and corner radius as .blk rect.body on the canvas — with a play
           triangle standing in for a title, so an embed that hides its own UI
           still has a way to start the flowgraph without adding chrome that
           doesn't belong on it. Positioned over #workspaceContent rather than
           inside the canvas's own scroll/zoom transform, so it stays in the
           corner of the frame regardless of where the reader has scrolled or
           zoomed. Hidden — and inert — everywhere else. -->
      <div id="embedPlayCorner" class="embed-play-corner" hidden>
        <button id="embedPlayBlock" class="embed-play-block" type="button"
                title="Run the flowgraph" aria-label="Run the flowgraph">
          <svg viewBox="0 0 70 60" aria-hidden="true">
            <rect class="body" x="0.5" y="0.5" width="69" height="59" rx="2"></rect>
            <path class="icon-play" d="M26 17 L46 30 L26 43 Z"></path>
            <rect class="icon-stop" x="24" y="19" width="22" height="22"></rect>
          </svg>
        </button>
        <!-- Same block styling and size as the Run stand-in beside it — and the
             same destination as #embedOpen (kept current the same way, by
             refreshEmbedOpen) — since a ?no_controls=1 host has no chrome of its
             own to offer a way out to the full application either. A real <a>,
             not a button, for the same reason as #embedOpen: middle-click and
             "copy link address" should work as the reader expects. -->
        <a id="embedOpenBlock" class="embed-play-block" target="_blank" rel="noopener noreferrer"
           href="/" title="Open in GNU Radio World" aria-label="Open in GNU Radio World">
          <svg viewBox="0 0 70 60" aria-hidden="true">
            <rect class="body" x="0.5" y="0.5" width="69" height="59" rx="2"></rect>
            <path class="icon-open" d="M30 16 H22 V44 H50 V36 M38 16 H50 V28 M50 16 L32 34"></path>
          </svg>
        </a>
      </div>
    </div>
    <div id="consoleSplitter" role="separator" aria-label="Resize console"
         aria-orientation="horizontal" aria-valuemin="29" tabindex="0"></div>
    <!-- Collapses the console. Only the narrow layout shows it, where the 7px
         splitter above is too small to drag and the console is a third of the
         screen; it stays put while collapsed, so it can open the pane again. -->
    <button id="consoleToggle" type="button" aria-controls="log" aria-expanded="true">
      Console <span id="consoleToggleCaret" aria-hidden="true">▾</span>
    </button>
    <div id="log"></div>
  </div>
</div>
<input id="fileOpen" type="file" accept=".grc" hidden />
<script type="module" src="/src/bootstrap.ts"></script>
</body>
</html>
