<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
The site mark. Deliberately not the wordmark: a 1007x433 lockup is unreadable at
the 16px Google shows beside a search result, so this is the two motifs the logo
is built from - GNU Radio's orange broadcast arcs over the blue sine wave that
underlines "World" - drawn as a GRC block with its ports.

The geometry is laid out on a 48px grid - the largest favicon.ico frame, and
the size this mark was drawn at - scaled 4/3 into this 64-unit viewBox, so every
edge lands on a whole device pixel in the 48px raster. 32px and 16px are 2/3 and
1/3 of that grid, so they antialias; 16px in particular renders the 2px block
border at 0.67px and the 1px port outlines at 0.33px, which is why it reads
softer than the larger frames. The borders are strokes centred on the rect,
hence the half-pixel offsets. Each port rect runs *under* the block's border,
which is painted after them and hides their inner edge.

Regenerate the raster set from this file with scripts/make-favicons.mjs.
-->

