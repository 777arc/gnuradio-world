name: Deploy WASM

# Production deploy: build the whole stack from source and publish it to the
# Cloudflare Pages project `gnuradio-wasm` on every merge to main.
#
# The build itself lives in the reusable build.yml, which pr-preview-build.yml
# also calls, so a preview and production are compiled by the same steps. Read
# that file for the caching notes (sysroot as an output cache, ccache for GR /
# qtgui / runner) and for why the smoke tests gate the deploy.
#
# This workflow is only ever triggered by events that run in this repository's
# own context -- push to main, workflow_dispatch, schedule -- which is what makes
# `secrets: inherit` safe here. A fork's code never reaches this path; it goes
# through pr-preview-build.yml, which passes no secrets at all.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — cache keepalive, does not deploy
  workflow_dispatch:
    inputs:
      rebuild_sysroot:
        description: "Ignore the sysroot cache and rebuild the deps from source (tests the cold path)"
        type: boolean
        default: false
      deploy:
        description: "Deploy to Cloudflare Pages (manual runs only; pushes always deploy)"
        type: boolean
        default: false

# Keyed on the ref, not a fixed string: a global group would let any other run
# of this workflow cancel an in-flight production deploy.
concurrency:
  group: deploy-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      rebuild_sysroot: ${{ inputs.rebuild_sysroot || false }}
      save_ccache: true
      # Pushes deploy, so keeping a copy would only burn storage. Manual and
      # scheduled runs keep the site as an artifact to inspect instead.
      upload_site: ${{ github.event_name != 'push' }}
      artifact_name: wasm-site
      # Pushes to main always deploy. Manual runs deploy only when asked, and the
      # weekly cache-keepalive run never does.
      deploy: ${{ github.event_name == 'push' || inputs.deploy || false }}
      deploy_project: gnuradio-wasm
      deploy_branch: main
    secrets: inherit
