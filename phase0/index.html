<!doctype html>
<html>
<head><meta charset="utf-8"><title>GNU Radio WASM — Phase 0</title></head>
<body>
<h1>GNU Radio WASM — Phase 0 smoke test</h1>
<pre id="log">loading…</pre>
<!-- machine-readable result line for the headless smoke runner (--dump-dom greps this) -->
<div id="result" data-status="pending">RESULT: pending</div>
<script type="module">
const logEl = document.getElementById('log');
const resEl = document.getElementById('result');
const lines = [];
const log = (s) => { lines.push(s); logEl.textContent = lines.join('\n'); };
const finish = (ok, msg) => {
  resEl.dataset.status = ok ? 'pass' : 'fail';
  resEl.textContent = (ok ? 'RESULT: PHASE0_PASS ' : 'RESULT: PHASE0_FAIL ') + msg;
};

// The two infra facts we most want to prove early:
const iso = self.crossOriginIsolated === true;
const sab = typeof SharedArrayBuffer !== 'undefined';
log('crossOriginIsolated = ' + iso);
log('SharedArrayBuffer   = ' + sab);

try {
  const { default: createGrModule } = await import('./hello.js');
  const mod = await createGrModule({ print: (t) => log('[wasm] ' + t) });
  const selftest = mod.ccall('gr_wasm_selftest', 'number', [], []);
  log('ccall gr_wasm_selftest() = ' + selftest);
  const wasmRan = Number.isFinite(selftest);
  const ok = iso && sab && wasmRan;
  finish(ok, `iso=${iso} sab=${sab} wasmRan=${wasmRan} selftest=${selftest}`);
} catch (e) {
  log('ERROR: ' + (e && e.stack || e));
  finish(false, 'exception: ' + e);
}
</script>
</body>
</html>
